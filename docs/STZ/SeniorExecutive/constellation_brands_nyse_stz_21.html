<title>Constellation Brands (NYSE: STZ) — 21位核心高管与董事会治理深度研究</title>
<style>
  :root {
    --bg: #F6F8FB;
    --surface: #FFFFFF;
    --surface-2: #F0F4F9;
    --border: #E2E8F0;
    --text: #0F172A;
    --text-2: #475569;
    --text-3: #64748B;
    --primary: #0073E6;
    --primary-2: #3399FF;
    --primary-soft: rgba(0, 115, 230, 0.09);
    --success: #059669;
    --success-soft: rgba(5, 150, 105, 0.10);
    --warn: #D97706;
    --warn-soft: rgba(217, 119, 6, 0.10);
    --danger: #DC2626;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.06);
    --radius: 12px;
    --radius-sm: 8px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  html[data-theme="dark"] {
    --bg: #0B111A;
    --surface: #111827;
    --surface-2: #1A2332;
    --border: #263347;
    --text: #F1F5F9;
    --text-2: #CBD5E1;
    --text-3: #94A3B8;
    --primary: #3399FF;
    --primary-2: #66B2FF;
    --primary-soft: rgba(51, 153, 255, 0.14);
    --success: #34D399;
    --success-soft: rgba(52, 211, 153, 0.14);
    --warn: #FBBF24;
    --warn-soft: rgba(251, 191, 36, 0.14);
    --danger: #F87171;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 6px 24px rgba(0, 0, 0, 0.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select { font-family: inherit; }

  /* Sticky AppBar */
  .appbar {
    position: sticky; top: 0; z-index: 50;
    height: 58px; padding: 0 18px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .appbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; font-size: 15px;
    transition: all .15s ease;
  }
  .icon-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .monogram {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, var(--primary), #004C99);
    color: #fff; font-weight: 800; font-size: 12px; letter-spacing: .5px;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .breadcrumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .breadcrumbs strong { color: var(--text); font-weight: 600; }
  .appbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
    white-space: nowrap;
  }
  .chip.blue { background: var(--primary-soft); border-color: color-mix(in srgb, var(--primary) 30%, transparent); color: var(--primary); }
  .chip.green { background: var(--success-soft); border-color: color-mix(in srgb, var(--success) 30%, transparent); color: var(--success); }
  .pill-btn {
    height: 32px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-2); font-size: 12px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all .15s;
  }
  .pill-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .pill-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .pill-btn.primary:hover { filter: brightness(1.08); color: #fff; }

  /* Layout Shell */
  .shell { display: flex; max-width: 1520px; margin: 0 auto; min-height: calc(100vh - 58px); }
  .sidebar {
    width: 296px; flex-shrink: 0; border-right: 1px solid var(--border);
    background: var(--surface); padding: 16px; position: sticky; top: 58px;
    height: calc(100vh - 58px); overflow-y: auto; transition: margin-left .2s ease;
  }
  .sidebar.collapsed { display: none; }
  .main { flex: 1; min-width: 0; padding: 20px 26px 56px; }

  /* Sidebar Monograph Card */
  .side-card {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 14px;
  }
  .side-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .avatar {
    width: 42px; height: 42px; border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), #0A3D7A);
    color: #fff; font-weight: 800; font-size: 14px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .side-name { font-size: 14px; font-weight: 700; line-height: 1.25; }
  .side-role { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .mini-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .mini-kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 6px; text-align: center; }
  .mini-kpi .v { font-size: 12px; font-weight: 700; color: var(--primary); font-family: var(--font-mono); }
  .mini-kpi .k { font-size: 10px; color: var(--text-3); margin-top: 1px; }

  .toc-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin: 14px 0 8px; }
  .toc-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 3px; }
  .toc-link {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px;
    font-size: 12.5px; font-weight: 500; color: var(--text-2); transition: all .15s;
  }
  .toc-link:hover { background: var(--surface-2); color: var(--primary); text-decoration: none; }
  .toc-link.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .toc-num { font-family: var(--font-mono); font-size: 11px; opacity: .75; }

  .progress-wrap { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .progress-bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 6px 0 10px; }
  .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width .2s; }

  /* Top Interactive Switcher */
  .hub-switcher {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: var(--shadow-sm); margin-bottom: 20px;
  }
  .hub-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .cat-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .cat-pill {
    padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2);
    cursor: pointer; transition: all .15s;
  }
  .cat-pill:hover { border-color: var(--primary); color: var(--primary); }
  .cat-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .hub-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .exec-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap: 7px;
  }
  .exec-pill {
    text-align: left; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); cursor: pointer; transition: all .15s;
    display: flex; align-items: center; gap: 8px;
  }
  .exec-pill:hover { border-color: var(--primary); transform: translateY(-1px); }
  .exec-pill.active {
    background: var(--primary-soft); border-color: var(--primary);
    box-shadow: 0 0 0 1px var(--primary);
  }
  .exec-pill .ep-av {
    width: 28px; height: 28px; border-radius: 7px; background: var(--surface);
    border: 1px solid var(--border); font-size: 11px; font-weight: 700; color: var(--primary);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .exec-pill.active .ep-av { background: var(--primary); color: #fff; border-color: var(--primary); }
  .exec-pill .ep-name { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exec-pill .ep-role { font-size: 10.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Chapter Sections */
  .sec-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px 24px; margin-bottom: 18px; box-shadow: var(--shadow-sm);
  }
  .sec-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .sec-eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: .06em; }
  .sec-title { font-size: 19px; font-weight: 800; margin: 2px 0 0; letter-spacing: -0.01em; }

  .hero-banner {
    background: linear-gradient(135deg, var(--primary-soft), transparent 70%);
    border: 1px solid color-mix(in srgb, var(--primary) 24%, var(--border));
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px;
  }
  .hero-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
  .hero-id { display: flex; align-items: center; gap: 14px; }
  .hero-av {
    width: 56px; height: 56px; border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), #004494);
    color: #fff; font-size: 20px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .hero-name { font-size: 22px; font-weight: 800; margin: 0; }
  .hero-sub { font-size: 13.5px; color: var(--text-2); margin-top: 2px; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--text-2); }
  .thesis-box { margin-top: 12px; font-size: 14px; color: var(--text); line-height: 1.65; }

  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 14px 0; }
  .kpi-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 13px 14px; }
  .kpi-label { font-size: 11.5px; color: var(--text-3); font-weight: 600; }
  .kpi-val { font-size: 20px; font-weight: 800; color: var(--primary); font-family: var(--font-mono); margin: 4px 0 2px; }
  .kpi-sub { font-size: 11.5px; color: var(--text-2); }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .panel h4 { margin: 0 0 10px; font-size: 13.5px; font-weight: 700; color: var(--text); }
  .canvas-wrap { position: relative; width: 100%; height: 270px; }
  .canvas-wrap canvas { width: 100%; height: 100%; display: block; }

  /* Table */
  .table-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .search-input {
    height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 13px; min-width: 240px;
  }
  .table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: var(--surface-2); font-weight: 700; color: var(--text-2); white-space: nowrap; }
  tr:hover td { background: var(--primary-soft); cursor: pointer; }
  tr.active-row td { background: var(--primary-soft); font-weight: 600; }

  /* Simulator */
  .sim-grid { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
  .slider-row { margin-bottom: 12px; }
  .slider-head { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
  .slider-row input[type="range"] { width: 100%; accent-color: var(--primary); }
  .sim-out { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }

  /* Timeline & Battles */
  .timeline-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .act-card { background: var(--surface-2); border: 1px solid var(--border); border-top: 3px solid var(--primary); border-radius: 10px; padding: 14px; }
  .act-card h5 { margin: 0 0 6px; font-size: 13.5px; font-weight: 800; color: var(--primary); }
  .battles-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .battle-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px; }
  .battle-card h5 { margin: 0 0 5px; font-size: 13.5px; font-weight: 700; }

  /* Checklist */
  .chk-list { display: flex; flex-direction: column; gap: 8px; }
  .chk-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 11px 13px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; cursor: pointer;
  }
  .chk-item.done { border-color: color-mix(in srgb, var(--success) 45%, var(--border)); background: var(--success-soft); }
  .chk-item input { margin-top: 3px; accent-color: var(--success); width: 16px; height: 16px; }

  /* Citations */
  .cite-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .cite-link {
    display: flex; flex-direction: column; gap: 3px; padding: 10px 12px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px;
    font-size: 12.5px; color: var(--text); transition: all .15s;
  }
  .cite-link:hover { border-color: var(--primary); background: var(--primary-soft); text-decoration: none; }
  .cite-url { font-size: 11px; color: var(--primary); word-break: break-all; font-family: var(--font-mono); }

  /* Modal Cmd+K */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); z-index: 100;
    display: none; align-items: flex-start; justify-content: center; padding-top: 90px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-box {
    width: min(580px, 92vw); background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow-md); overflow: hidden;
  }
  .modal-input {
    width: 100%; padding: 14px 16px; border: none; border-bottom: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 15px; outline: none;
  }
  .modal-results { max-height: 340px; overflow-y: auto; padding: 8px; }
  .modal-item {
    padding: 9px 12px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  }
  .modal-item:hover { background: var(--primary-soft); }

  @media (max-width: 1080px) {
    .sidebar { display: none; }
    .sidebar.mobile-open { display: block; position: fixed; left: 0; top: 58px; z-index: 60; box-shadow: var(--shadow-md); }
    .kpi-grid, .two-col, .sim-grid, .timeline-grid, .battles-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 680px) {
    .chip.hide-sm { display: none; }
    .main { padding: 14px 12px 40px; }
  }
</style>

function saveState() {
  try { localStorage.setItem("stz_exec_hub_v1", JSON.stringify({ checks: state.checks, theme: state.theme, lang: state.lang })); } catch (e) {}
}

async function unpackReports() {
  const bin = atob(packedReports);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const ds = new DecompressionStream("gzip");
  const writer = ds.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const text = await new Response(ds.readable).text();
  return JSON.parse(text);
}

function t(obj) { return obj ? (obj[state.lang] || obj.en || "") : ""; }
function getActive() { return ALL_IPS.find(x => x.id === state.activeId) || ALL_IPS[0]; }
function getFiltered() { return state.cat === "all" ? ALL_IPS : ALL_IPS.filter(x => x.category === state.cat); }

function renderApp() {
  document.documentElement.setAttribute("data-theme", state.theme);
  document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.getAttribute("data-i18n");
    if (I18N[state.lang][k]) el.textContent = I18N[state.lang][k];
  });

  const cur = getActive();
  document.getElementById("crumbActive").textContent = t(cur.name);
  renderSidebar(cur);
  renderSwitcher(cur);
  renderChapters(cur);
  drawAllCharts(cur);
}

function computeSim() {
  const baseBeerSales = 8.3152; // $B FY26
  const projSalesB = baseBeerSales * Math.pow(1 + state.sim.beerGrowth / 100, 2);
  const beerOpIncB = projSalesB * (state.sim.beerMargin / 100);
  const wsOpIncB = 0.06; // conservative post-turnaround W&S contribution
  const corpInterestTax = 0.95; // corporate + interest + tax approximation calibrated to FY26 $2.075B comp net income on $3.16B beer opinc
  const netIncB = Math.max(0.5, beerOpIncB + wsOpIncB - corpInterestTax);
  const sharesM = Math.max(120, 173.5 - (state.sim.buybackB * 2000 / 145));
  const eps = (netIncB * 1000) / sharesM;
  const price = eps * state.sim.pe;
  const upside = ((price - 141.87) / 141.87) * 100;
  return { beerOpIncB, eps, price, upside };
}

function setupCanvas(id) {
  const c = document.getElementById(id);
  if (!c) return null;
  const rect = c.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(260, rect.width || 420);
  const h = Math.max(220, rect.height || 260);
  c.width = w * dpr;
  c.height = h * dpr;
  const ctx = c.getContext("2d");
  ctx.scale(dpr, dpr);
  return { ctx, w, h };
}

function themeColors() {
  const dark = state.theme === "dark";
  return {
    text: dark ? "#CBD5E1" : "#334155",
    muted: dark ? "#64748B" : "#94A3B8",
    grid: dark ? "rgba(148,163,184,0.14)" : "rgba(15,23,42,0.08)",
    primary: dark ? "#3399FF" : "#0073E6",
    accent: dark ? "#34D399" : "#059669",
    warn: dark ? "#FBBF24" : "#D97706"
  };
}

function drawAllCharts(cur) {
  drawCh1();
  drawRadar(cur);
  drawBars();

  drawSim();
}

function drawCh1() {
  const s = setupCanvas("chartCh1"); if (!s) return;
  const { ctx, w, h } = s; const col = themeColors();
  const labels = ["FY25", "FY26", "Q2 FY27 (x4)"];
  const beer = [8540, 8315, 2474 * 4];
  const ws = [1669, 824, 159.4 * 4];
  const pad = { l: 48, r: 16, t: 28, b: 32 };
  const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
  const maxV = 11000;
  ctx.clearRect(0, 0, w, h);
  ctx.font = "11px sans-serif";
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + ch - (i / 4) * ch;
    ctx.strokeStyle = col.grid; ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillStyle = col.muted; ctx.textAlign = "right"; ctx.fillText("$" + ((maxV / 4 * i) / 1000).toFixed(1) + "B", pad.l - 6, y + 4);
  }

function drawRadar(cur) {
  const s = setupCanvas("chartRadar"); if (!s) return;

    ctx.beginPath();

      const ang = -Math.PI / 2 + (i * 2 * Math.PI) / axes.length;
      const rr = (r * lv) / 4;
      const x = cx + Math.cos(ang) * rr, y = cy + Math.sin(ang) * rr;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);

  }
  ctx.beginPath();
  cur.radar.forEach((val, i) => {
    const ang = -Math.PI / 2 + (i * 2 * Math.PI) / axes.length;
    const rr = (r * val) / 100;
    const x = cx + Math.cos(ang) * rr, y = cy + Math.sin(ang) * rr;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);

function bindEvents() {
  document.getElementById("btnTheme").addEventListener("click", () => {

  document.getElementById("btnPrev").addEventListener("click", () => {

    renderApp();
  });

  });

  const doExport = () => {
    const blob = new Blob([document.documentElement.outerHTML], { type: "text/html;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "Constellation_Brands_21_Executives.single.html";
    a.click();
    URL.revokeObjectURL(a.href);
  };
  document.getElementById("btnExportTop").addEventListener("click", doExport);
  document.getElementById("btnExportSide").addEventListener("click", doExport);

  document.getElementById("btnResetChk").addEventListener("click", () => {
    const cur = getActive();
    cur.checklist[state.lang].forEach((_, i) => delete state.checks[cur.id + "_" + i]);
    saveState(); renderApp();
  });

  document.getElementById("chaptersRoot").addEventListener("input", e => {
    if (e.target.id === "tblSearch") {
      state.tableFilter = e.target.value;
      renderChapters(getActive());
      drawAllCharts(getActive());
      const inp = document.getElementById("tblSearch");
      if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      return;
    }
    if (["slBg", "slBm", "slBb", "slPe"].includes(e.target.id)) {
      state.sim.beerGrowth = parseFloat(document.getElementById("slBg").value);
      state.sim.beerMargin = parseFloat(document.getElementById("slBm").value);
      state.sim.buybackB = parseFloat(document.getElementById("slBb").value);
      state.sim.pe = parseFloat(document.getElementById("slPe").value);
      document.getElementById("lblBg").textContent = state.sim.beerGrowth.toFixed(1) + "%";
      document.getElementById("lblBm").textContent = state.sim.beerMargin.toFixed(1) + "%";
      document.getElementById("lblBb").textContent = "$" + state.sim.buybackB.toFixed(1) + "B";
      document.getElementById("lblPe").textContent = state.sim.pe.toFixed(1) + "x";
      const r = computeSim();
      document.getElementById("simOpInc").textContent = "$" + r.beerOpIncB.toFixed(2) + "B";

    const k = e.target.getAttribute("data-chk");
    if (!k) return;
    if (e.target.checked) state.checks[k] = true; else delete state.checks[k];
    saveState();
    renderSidebar(getActive());
    e.target.closest(".chk-item").classList.toggle("done", e.target.checked);
  });

  document.getElementById("chaptersRoot").addEventListener("click", e => {
    const tr = e.target.closest("tr[data-row-id]");
    if (!tr) return;
    state.activeId = tr.getAttribute("data-row-id");
    renderApp();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // Cmd+K Modal
  const modal = document.getElementById("cmdModal");
  const cmdInput = document.getElementById("cmdInput");
  const renderCmd = () => {
    const q = cmdInput.value.trim().toLowerCase();
    const hits = ALL_IPS.filter(x => !q || t(x.name).toLowerCase().includes(q) || t(x.role).toLowerCase().includes(q));
    document.getElementById("cmdResults").innerHTML = hits.map(h => `
      <div class="modal-item" data-jump="${h.id}">
        <div><strong>${t(h.name)}</strong><div style="font-size:12px;color:var(--text-3);">${t(h.role)}</div></div>
        <span class="tag">${h.category.toUpperCase()}</span>
      </div>

  };
  document.getElementById("btnCmdK").addEventListener("click", () => { modal.classList.add("open"); cmdInput.value = ""; renderCmd(); cmdInput.focus(); });
  modal.addEventListener("click", e => {
    if (e.target === modal) modal.classList.remove("open");
    const it = e.target.closest("[data-jump]");
    if (it) { state.activeId = it.getAttribute("data-jump"); modal.classList.remove("open"); renderApp(); }
  });
  cmdInput.addEventListener("input", renderCmd);
  window.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); document.getElementById("btnCmdK").click(); }
    if (e.key === "Escape") modal.classList.remove("open");
  });
  window.addEventListener("resize", () => drawAllCharts(getActive()));
}

(async function init() {
  PAYLOAD = await unpackReports();
  ALL_IPS = PAYLOAD.leaders;
  bindEvents();
  renderApp();
})();

            return r.ok ? r.json() : null;
          }).then(function (data) {
            if (!data || !Array.isArray(data[0]) || curLang !== 'en') return;
            var fullEn = data[0].map(function (seg) { return seg && seg[0] ? seg[0] : ''; }).join('');
            var parts = fullEn.split(/\s*====\s*/);
            if (parts.length === slice.length) {
              for (var k = 0; k < slice.length; k++) {
                var enTxt = parts[k].trim();
                if (enTxt) {
                  netTransCache[slice[k].zh] = enTxt;
                  if (curLang === 'en') slice[k].node.nodeValue = slice[k].lead + enTxt + slice[k].trail;
                }
              }
            }
            nextBatch();
          }).catch(function () {
            if (timer) clearTimeout(timer);
          });
        }
        nextBatch();
      }

      function applyDetailLang(lang, persist) {
        curLang = (lang === 'en') ? 'en' : 'zh';
        var en = (curLang === 'en');
        document.documentElement.setAttribute('lang', en ? 'en' : 'zh-CN');
        document.documentElement.setAttribute('data-lang', curLang);

        var zhB = document.getElementById('portalDetailZhBtn');
        var enB = document.getElementById('portalDetailEnBtn');
        if (zhB && enB) {
          zhB.classList.toggle('active', !en);
          enB.classList.toggle('active', en);
          zhB.setAttribute('aria-pressed', !en ? 'true' : 'false');
          enB.setAttribute('aria-pressed', en ? 'true' : 'false');
        }
        var thB = document.getElementById('portalDetailThemeBtn');
        if (thB) {
          thB.setAttribute('title', en ? 'Toggle Light / Dark theme' : '切换浅色 / 深色主题');
          thB.setAttribute('aria-label', en ? 'Toggle color theme' : '切换深浅色主题');
        }

        var tagged = document.querySelectorAll('[data-i18n-zh][data-i18n-en]');
        for (var d = 0; d < tagged.length; d++) {
          tagged[d].textContent = en ? tagged[d].getAttribute('data-i18n-en') : tagged[d].getAttribute('data-i18n-zh');
        }

        var cjkRe = /[\u4e00-\u9fff]/;
        var pendingOnline = [];
        var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
        var n;
        while ((n = walker.nextNode())) {
          var p = n.parentElement;
          if (!p) continue;
          var tn = p.tagName;
          if (tn === 'SCRIPT' || tn === 'STYLE' || p.closest('#portalDetailLangSwitch') || p.closest('[data-i18n-zh]')) continue;
          var raw = n.nodeValue || '';
          var trimmed = raw.replace(/\s+/g, ' ').trim();
          if (!trimmed) continue;

          if (!origTextMap.has(n) && cjkRe.test(trimmed)) {
            origTextMap.set(n, raw);
          }

          var lead = (raw.match(/^\s*/) || [''])[0];
          var trail = (raw.match(/\s*$/) || [''])[0];

          if (en) {
            var baseRaw = origTextMap.has(n) ? origTextMap.get(n) : raw;
            var baseTrim = baseRaw.replace(/\s+/g, ' ').trim();
            var hit = zh2en[baseTrim] || translateDynamicPattern(baseTrim, true) || netTransCache[baseTrim];
            if (hit) {
              n.nodeValue = lead + hit + trail;
            } else if (cjkRe.test(baseTrim) && baseTrim.length >= 2) {
              pendingOnline.push({ node: n, zh: baseTrim, lead: lead, trail: trail });
            }
          } else {
            if (origTextMap.has(n)) {
              n.nodeValue = origTextMap.get(n);
            } else {
              var rev = en2zh[trimmed] || translateDynamicPattern(trimmed, false);
              if (rev) n.nodeValue = lead + rev + trail;
            }
          }
        }

        if (persist) setStoreStr(LANG_KEY, curLang);
        if (en && pendingOnline.length) {
          maybeTranslateRemainingOnline(pendingOnline);
        }
      }

      function initDetailPortalSync() {
        var savedTheme = getStoreStr(THEME_KEY, 'light');
        applyDetailTheme(savedTheme === 'dark' ? 'dark' : 'light', false);

        var savedLang = getStoreStr(LANG_KEY, 'zh');
        applyDetailLang(savedLang === 'en' ? 'en' : 'zh', false);

        var tBtn = document.getElementById('portalDetailThemeBtn');
        if (tBtn) {
          tBtn.addEventListener('click', function () {
            var nextDark = !document.documentElement.classList.contains('dark');
            applyDetailTheme(nextDark ? 'dark' : 'light', true);
          });
        }
        var zBtn = document.getElementById('portalDetailZhBtn');
        var eBtn = document.getElementById('portalDetailEnBtn');
        if (zBtn) zBtn.addEventListener('click', function () { applyDetailLang('zh', true); });
        if (eBtn) eBtn.addEventListener('click', function () { applyDetailLang('en', true); });

        window.addEventListener('storage', function (ev) {
          if (ev.key === THEME_KEY && ev.newValue) {
            var nt = String(ev.newValue).replace(/^"|"$/g, '');
            if (nt === 'light' || nt === 'dark') applyDetailTheme(nt, false);
          } else if (ev.key === LANG_KEY && ev.newValue) {
            var nl = String(ev.newValue).replace(/^"|"$/g, '');
            if (nl === 'zh' || nl === 'en') applyDetailLang(nl, false);
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initDetailPortalSync);
      } else {
        initDetailPortalSync();
      }
    })();
  </script>
<!-- PORTAL_DETAIL_SYNC_JS_END -->

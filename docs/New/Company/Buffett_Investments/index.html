ivate-equity breakup, they turned directly to Warren Buffett for a **$585M** acquisition. Operating **>7,000 stores** across 20+ countries (led by the U.S. and China), IDQ is >99% franchised—meaning franchisees fund store capex and labor while IDQ collects high-margin top-line royalties and proprietary mix margins, sending pure free cash flow to Omaha year after year."},{"idx":39,"slug":"39_HIST_BYD","ticker":"HKEX: 1211 (已圆满清仓)","mono":"1211","group":"historical","group_zh":"历史传奇与败局教训","group_en":"Historical Legends & Lessons","name_zh":"比亚迪股份有限公司 BYD Company Limited","name_en":"BYD Company Limited (1211.HK)","short_zh":"比亚迪 (BYD)","short_en":"BYD (1211.HK · Exited)","status_zh":"2008–2025 十七年陪伴 · $2.3亿本金斩获超 30倍 (~$70–$90亿利润)","status_en":"2008–2025 17-Year Odyssey · $230M → >30x Return (~$7B–$9B Gain)","entry_yr":"2008.09 → 2025Q1清仓","val_or_gain_zh":"$2.3亿变 ~$70–$90亿+ (涨3,890%)","val_or_gain_en":"~30x+ Gain (+3,890% Stock Rise)","core_metric_zh":"FY25 营收 ¥8,040亿 (>460万辆)","core_metric_en":"FY25 Rev ¥804B (>4.6M EVs)","verdict_zh":"查理·芒格与李录力荐的跨国奇迹 —— 坚守14年一股不卖见证全球新能源车王登顶","verdict_en":"Charlie Munger & Li Lu's Masterstroke: 14 Years Untouched Before Graceful 30x+ Exit","summary_zh":"2008 年 9 月全球金融危机最恐慌时刻，在查理·芒格（盛赞王传福是“爱迪生与韦尔奇合体”）与李录的极力推荐下，伯克希尔通过中美能源以每股 **8 港元（总额仅 $2.30–$2.32 亿美元）** 认购 2.25 亿股比亚迪 H 股（占总股本约 10%）。在长达 14 年的补贴退坡与股价过山车中，巴菲特与芒格一股未卖！待比亚迪凭刀片电池与 DM-i 混动超越特斯拉登顶全球新能源销量冠军后，伯克希尔自 2022 年 8 月（277 港元高位）起从容分批减持，并于 2025 年一季度圆满清仓，累计实现收益约 **$70–$90 亿美元（超 30 倍回报，期间股价狂飙 3,890%）**，比亚迪官方专门发文致谢 17 年相伴。","summary_en":"In September 2008, acting on Charlie Munger and Li Lu's fierce conviction in founder Wang Chuanfu, Berkshire Hathaway Energy paid **HK$8/sh (~$230M–$232M)** for 225M H-shares (~10% of BYD). Holding every single share untouched for 14 turbulent years until BYD overtook Tesla as the world's #1 EV maker, Berkshire began staged sales in August 2022 (starting at HK$277/sh) and completed its full exit in Q1 2025—reaping **~30x+ (~$7B–$9B+ realized gains)** across a 3,890% 17-year run."},{"idx":40,"slug":"40_HIST_PetroChina","ticker":"HKEX: 0857 (已圆满清仓)","mono":"0857","group":"historical","group_zh":"历史传奇与败局教训","group_en":"Historical Legends & Lessons","name_zh":"中国石油天然气股份 PetroChina Co. Ltd.","name_en":"PetroChina Company Limited (0857.HK)","short_zh":"中国石油 (PetroChina)","short_en":"PetroChina (0857.HK · Exited)","status_zh":"2002–2007 纯读年报封神战 · $4.88亿变 $40亿 (~8.2倍 / 年化55%)","status_en":"2002–2007 Pure Annual-Report Classic · $488M → $4.0B (8.2x / ~55% IRR)","entry_yr":"2002–2003 → 2007清仓","val_or_gain_zh":"$4.88亿 → $40.0亿 (8.2x MOIC)","val_or_gain_en":"$488M → $4.0B (8.2x MOIC)","core_metric_zh":"年化复利 ~55% IRR","core_metric_en":"~55% Annualized Return","verdict_zh":"未见管理层一面、未看一篇券商研报 —— 仅凭办公室读年报狂赚 35 亿美元！","verdict_en":"Zero Management Meetings, Zero Wall Street Notes: $3.5B Profit Purely from Reading the Annual Report","summary_zh":"中国石油（PetroChina）是巴菲特毕生最纯粹的**本杰明·格雷厄姆式“价格与价值巨大鸿沟”教科书**：2002–2003 年巴菲特坐在奥马哈办公室静读中石油英文年报，算出其原油储量与产量相当于埃克森美孚的四分之三、内在价值至少 **$1,000 亿美元**，然后再看一眼港股总市值——竟然只有 **$350 亿美元**（相当于 3.5 折大甩卖，市盈率仅 3 倍、股息率近 10%）！他没有实地调研也没见高管，果断斥资 **$4.88 亿美元**买下约 1.3% 总股本；五年后 2007 年油价大牛市与 A 股回归热潮将其总市值推上 $2,750 亿，巴菲特以 **$40 亿美元**从容清仓，五年狂赚 8.2 倍（年化复利高达 **~55%**）！","summary_en":"PetroChina is Buffett's purest Ben Graham valuation masterclass: sitting alone in Omaha in 2002–2003 reading PetroChina's annual report *before* checking the stock price, Buffett estimated the oil giant was worth at least **$100B**—then saw it trading at a **$35B** total market cap (~3x earnings, ~45% dividend payout). Without visiting China or meeting management, Berkshire invested **$488M**; five years later in 2007, as oil surged and valuation hit ~$275B, Buffett exited for **$4.0B** (~8.2x MOIC, **~55% annualized IRR**)."},{"idx":41,"slug":"41_HIST_Washington_Post","ticker":"NYSE: WPO / GHC (已税优置换)","mono":"WPO","group":"historical","group_zh":"历史传奇与败局教训","group_en":"Historical Legends & Lessons","name_zh":"华盛顿邮报 / 格雷厄姆控股 The Washington Post","name_en":"The Washington Post Co. / Graham Holdings","short_zh":"华盛顿邮报 (Washington Post)","short_en":"Washington Post (100x Legend)","status_zh":"1973–2014 四十一年守望 · $1,060万本金化作 $11亿 (>100倍传奇)","status_en":"1973–2014 41-Year Hold · $10.6M Cost → $1.1B Tax-Free Swap (>100x)","entry_yr":"1973 → 2014税优置换","val_or_gain_zh":"$1,060万 → ~$11亿 (>100倍)","val_or_gain_en":"$10.6M → ~$1.1B (>100x Return)","core_metric_zh":"单年股息超原始总本金","core_metric_en":"$17M/yr Div > $10.6M Cost","verdict_zh":"携手凯瑟琳·格雷厄姆书写商业史佳话 —— 2折买入垄断媒体加40%股本回购","verdict_en":"Katharine Graham + Warren Buffett: Buying $400M of Trophy Media for $80M + Massive Buybacks","summary_zh":"1973 年水门事件与熊市恐慌交织之际，华尔街所有分析师都承认《华盛顿邮报》旗下的报纸、《新闻周刊》与电视台拆卖至少值 **$4–$5 亿美元**，但其股票总市值却跌到仅 **$8,000 万美元**！巴菲特果断投入 **$1,060 万美元**买下约 10% 股份，并进入董事会成为传奇女社长**凯瑟琳·格雷厄姆（Katharine Graham）**最信赖的挚友与财务军师，建议她在低位回购注销了近 40% 流通股本！坚守 41 年后，至 2014 年（报业售予贝索斯更名 Graham Holdings 后），这笔 $1,060 万投资不仅单年分红（$1,700 万）就超过当年全部本金，更通过免税股权资产置换（迈阿密电视台+现金+伯克希尔自有股票）以约 **$11 亿美元（超 100 倍！）** 完美收官。","summary_en":"In the 1973 bear market, every media analyst agreed The Washington Post Co.'s newspapers, magazines, and TV stations were worth **$400M–$500M**, yet the entire company traded for **$80M**! Buffett invested **$10.6M**, joined the board as **Katharine Graham's** trusted mentor, and guided massive low-multiple share repurchases (~40% of shares retired). Held for 41 years until a 2014 tax-free asset/share swap with Graham Holdings, the $10.6M stake grew to **~$1.1B (>100x)** while paying $17M/yr in dividends—more each year than the entire initial outlay!"},{"idx":42,"slug":"42_HIST_Goldman_Sachs","ticker":"NYSE: GS (危机救援经典)","mono":"GS","group":"historical","group_zh":"历史传奇与败局教训","group_en":"Historical Legends & Lessons","name_zh":"高盛集团 The Goldman Sachs Group","name_en":"The Goldman Sachs Group, Inc. (GS)","short_zh":"高盛集团 (Goldman Sachs)","short_en":"Goldman Sachs (2008 Lifeline)","status_zh":"2008.09 雷曼倒闭后定海神针 · $50亿 10%优先股+权证净赚超 $30亿+","status_en":"Sept 2008 Crisis Lifeline · $5B 10% Preferred + Warrants → >$3B+ Profit","entry_yr":"2008.09.23 → 2020清仓","val_or_gain_zh":"每秒钟赚 $15.85 股息 + 权证暴利","val_or_gain_en":"$500M/yr Div + $115 Strike Warrants","core_metric_zh":"10% 票息 + 10% 赎回罚金","core_metric_en":"10% Coupon + 110% Call Price","verdict_zh":"“别人恐惧我贪婪”巅峰实战 —— 雷曼破产后72小时卖给华尔街最昂贵的信誉保险","verdict_en":"'Be Greedy When Others Are Fearful': Selling the World's Priciest Confidence Seal in 2008","summary_zh":"2008 年 9 月 15 日雷曼兄弟破产，全球融资市场瞬间冰封，高盛股价三周内从 $247 暴跌至 $107。9 月 23 日（高盛连夜转为银行控股公司仅两天后），巴菲特宣布向高盛注资 **$50 亿美元**：条件极其霸道——**10% 年息永续优先股（每年收息 $5 亿，每秒钟 $15.85！）、提前赎回须额外支付 10% 溢价（$5 亿罚金），外加按 $115/股认购 $50 亿普通股的五年期权证**！高盛买的不仅是 $50 亿现金，更是“巴菲特盖章认证高盛不会倒”的无价信心，次日即顺利增发 $50 亿普通股度过生死劫。2011 年高盛支付 $55 亿赎回优先股，2013 年权证无现金净额结算送给伯克希尔逾 1,300 万股高盛股票，累计净赚超 **$30 亿–$35 亿美元**！","summary_en":"Eight days after Lehman Brothers collapsed in September 2008, with funding markets frozen and Goldman Sachs shares plunging from $247 to $107, Buffett deployed **$5.0B** into Goldman on bespoke terms only Omaha could command: **10% perpetual preferred stock ($500M/yr dividend + 10% redemption premium)** plus **warrants to buy $5B of common stock at $115/sh**. Buffett's stamp of confidence stabilized Wall Street overnight. Redeemed at $5.5B in 2011 with warrants net-settled into >13M shares in 2013 (exited by 2020), the deal netted Berkshire **>$3B+** in profit."},{"idx":43,"slug":"43_HIST_Capital_Cities_ABC","ticker":"MERGED INTO DISNEY (1996)","mono":"CCAB","group":"historical","group_zh":"历史传奇与败局教训","group_en":"Historical Legends & Lessons","name_zh":"大都会/ABC广播公司 Capital Cities / ABC","name_en":"Capital Cities / ABC, Inc.","short_zh":"大都会/ABC (Cap Cities)","short_en":"Capital Cities/ABC (Exited)","status_zh":"1985–1996 商业史上最强双人管理组合汤姆·墨菲 × 丹·伯克 · $5.17亿变 $25亿","status_en":"1985–1996 Backing Tom Murphy & Dan Burke · $517M → $2.5B Disney Sale","entry_yr":"1985.03 → 1996售予迪士尼","val_or_gain_zh":"$5.17亿 → ~$25.0亿 (~5倍)","val_or_gain_en":"$517M → ~$2.5B (~5x Gain)","core_metric_zh":"局外人CEO资本配置鼻祖","core_metric_en":"'The Outsiders' #1 CEO Duo","verdict_zh":"巴菲特心中“人类商业史最伟大的管理搭档”—— 小鱼吞大象并购与分权控本神话","verdict_en":"Buffett's All-Time Greatest Management Duo: Tom Murphy & Dan Burke's Outsider Playbook","summary_zh":"巴菲特曾无数次表示：**汤姆·墨菲（Tom Murphy）与丹·伯克（Dan Burke）是人类商业史上最伟大的双人管理组合！** 1985 年 3 月，地方电视台起家的大都会通信（Capital Cities）上演惊天“蛇吞象”，斥资 $35 亿美元收购规模大自己三倍的美国广播公司（ABC，含当时尚未爆发的体育金矿 **ESPN**）。为防恶意收购，墨菲邀挚友巴菲特出资 **$5.175 亿美元**认购 300 万股（占 18%）压阵，巴菲特慷慨将 11 年投票权无偿委托给墨菲！在墨菲与伯克极致精简总部、下放分权与严苛回购治理下，公司价值飙升，并于 1995–1996 年经巴菲特牵线以 **$190 亿美元**售予华特迪士尼，伯克希尔收回约 **$25 亿美元**现金与迪士尼股票！","summary_en":"Buffett famously called CEO **Tom Murphy** and COO **Dan Burke** *'probably the greatest two-person combination in management that the world has ever seen.'* In March 1985, Berkshire put up **$517.5M** for an 18% anchor stake so tiny regional broadcaster Capital Cities could swallow giant network **ABC** (plus nascent crown jewel **ESPN**) for $3.5B—with Buffett handing Murphy his voting proxy for 11 years! After a decade of decentralized cost discipline and opportunistic buybacks, Buffett helped broker the **$19B** sale to Walt Disney in 1995–1996, turning Berkshire's $517M into **~$2.5B**."},{"idx":44,"slug":"44_HIST_Gillette","ticker":"ACQUIRED BY P&G (2005) → DURACELL","mono":"GILL","group":"historical","group_zh":"历史传奇与败局教训","group_en":"Historical Legends & Lessons","name_zh":"吉列公司 The Gillette Company (宝洁/金霸王)","name_en":"The Gillette Company (P&G / Duracell)","short_zh":"吉列剃须刀 (Gillette)","short_en":"Gillette (P&G → Duracell)","status_zh":"1989–2016 耗材商业模式典范 · $6亿优先股化作逾 $50亿宝洁股并免税换回金霸王","status_en":"1989–2016 Razor-and-Blade Icon · $600M → >$5B P&G → Tax-Free Duracell Swap","entry_yr":"1989.07 → 2005宝洁 → 2016金霸王","val_or_gain_zh":"$6.0亿 → >$50亿+ (>8.5倍)","val_or_gain_en":"$600M → >$5.0B+ (>8.5x Value)","core_metric_zh":"全球剃须刀片 ~70%巅峰份额","core_metric_en":"~70% Peak Global Blade Share","verdict_zh":"“一想到每晚全球 25 亿男人在睡觉时胡须都在疯长，我就睡得无比香甜”","verdict_en":"'Pleasant Dreams Knowing 2.5 Billion Men Grow Whiskers While I Sleep'","summary_zh":"1989 年 7 月，刚击退恶意收购的吉列公司向巴菲特发行 **$6 亿美元 8.75% 可转换优先股**。巴菲特欣然入局并留下传世名言：“每晚临睡前想到全世界有 25 亿男性明天一早起来都得刮胡子，我就倍感踏实！”随着 Sensor 与 Mach3（锋速3）剃须刀风靡全球（巅峰市占率超 70%），优先股转为 9,600 万股普通股（拆股后）。2005 年宝洁（P&G）以 $570 亿美元收购吉列，伯克希尔持仓市值跃升至**逾 $50 亿美元**；更绝的是在 2016 年，当 Dollar Shave Club 等电商品牌冲击刀片溢价时，巴菲特用手中约 $47 亿宝洁股票与宝洁完成**免税资产置换，100% 全资收回金霸王电池（Duracell，附带 $17 亿现金注资）**，省去十余亿美元资本利得税！","summary_en":"In July 1989, Buffett invested **$600M in 8.75% convertible preferred stock** of Gillette—famously remarking it gave him pleasant dreams knowing billions of men grew whiskers overnight. Converting into 96M split-adjusted shares as Sensor and Mach3 drove global blade share to ~70%, the stake topped **$5.0B** when Procter & Gamble acquired Gillette for $57B in 2005. In February 2016, Buffett engineered a brilliant tax-free split-off—exchanging ~$4.7B of P&G shares for 100% ownership of **Duracell** (recapitalized with $1.7B cash) while avoiding massive capital-gains taxes."},{"idx":45,"slug":"45_HIST_Wells_Fargo","ticker":"NYSE: WFC (1989–2022清仓)","mono":"WFC","group":"historical","group_zh":"历史传奇与败局教训","group_en":"Historical Legends & Lessons","name_zh":"富国银行 Wells Fargo & Company","name_en":"Wells Fargo & Company (WFC)","short_zh":"富国银行 (Wells Fargo)","short_en":"Wells Fargo (Exited 2022)","status_zh":"1990加州地产危机 $2.9亿抄底赚逾百亿 · 2016虚假账户丑闻后清仓","status_en":"1990 Panic $290M Buy → $25B+ Peak → Exited 2022 on Governance Failure","entry_yr":"1989–1990 → 2022Q1清仓","val_or_gain_zh":"峰值持仓逾 $250亿+ (赚超百亿)","val_or_gain_en":">$25B+ Peak Value (Multi-Billion Gain)","core_metric_zh":"激励扭曲毁掉声誉警钟","core_metric_en":"'Never Ignore Cockroaches' Lesson","verdict_zh":"前半场逆向抄底封神，后半场因扭曲交叉销售激励与掩盖丑闻遭巴菲特清仓","verdict_en":"Act I Contrarian Banking Masterpiece; Act II Governance Betrayal & Clean Break","summary_zh":"富国银行承载了巴菲特对银行业最辉煌的胜利与最痛心的治理失望：1990 年加州房地产崩盘、全华尔街做空富国银行之际，巴菲特逆势砸下 **$2.90 亿美元**买满 10% 股权（市盈率不足 5 倍！），此后三十年随并购西北银行与美联银行一路增持，峰值市值突破 **$250–$300 亿美元**，累计带来超百亿美元盈利与股息。然而 2016 年富国爆发震惊全美的**“数百万幽灵虚假账户交叉销售丑闻”**并遭美联储施加史无前例的资产规模上限处罚。巴菲特怒斥管理层“发现厨房有一只蟑螂却不立刻纠错”，最终在 2020–2022Q1 将坚守 32 年的富国银行一股不留彻底清仓！","summary_en":"Wells Fargo embodies both Buffett's greatest contrarian bank triumph and his sharpest governance rebuke: bought during the 1990 California real-estate panic (**$290M** for a 10% stake at <5x pre-provision earnings), the stake compounded for three decades past **$25B+** at peak. Yet after the **2016 fake-accounts cross-selling scandal** exposed toxic sales quotas and management's failure to escalate problems to the board, Buffett applied his 'there's never just one cockroach in the kitchen' rule—liquidating the entire 32-year position by Q1 2022."},{"idx":46,"slug":"46_HIST_Visa_Mastercard","ticker":"NYSE: V & MA (2011–2026Q1圆满止盈)","mono":"V/MA","group":"historical","group_zh":"历史传奇与败局教训","group_en":"Historical Legends & Lessons","name_zh":"维萨与万事达 Visa & Mastercard","name_en":"Visa Inc. (V) & Mastercard Inc. (MA)","short_zh":"维萨与万事达 (Visa/MA)","short_en":"Visa & Mastercard (Exited 26Q1)","status_zh":"2011–2026Q1 十五年十倍长跑 · 全球支付清算双寡头圆满落袋","status_en":"2011–2026Q1 15-Year >10x Run · Global Payment Rails Duopoly Harvested","entry_yr":"2011 → 2026Q1清仓获利","val_or_gain_zh":"十五年超 10 倍复利完美收官","val_or_gain_en":">10x Compounding Over 15 Years","core_metric_zh":"Visa 净利率高达 55.0%","core_metric_en":"55.0% Visa Net Margin (FY25)","verdict_zh":"托德·库姆斯加盟首秀 —— 全球无现金化浪潮 55% 净利率过路费印钞机","verdict_en":"Todd Combs' Signature 10-Bagger: Zero-Credit-Risk Global Payment Tollbooths","summary_zh":"2011 年托德·库姆斯（Todd Combs）加盟伯克希尔后，迅速在杜宾修正案（Durbin Amendment）监管恐慌砸出的低谷中同时建仓全球开放式卡组织双寡头 **Visa (V)** 与 **Mastercard (MA)**（巴菲特坦言自己本该更早重仓）。与承担信贷坏账的发卡银行不同，Visa 与 Mastercard 纯粹提供全球电子清算轨道，不放一分钱贷款却对全球每一笔跨境与刷卡交易抽取基点过路费：FY2025 Visa 净营收 **$359.3 亿美元**、净利润高达 **$197.4 亿美元（净利率惊人达 55.0%！）**；Mastercard Q4 2025 单季净营收亦增长 18% 达 $88 亿。坚守 15 年斩获逾 10 倍丰厚回报后，2026Q1 阿贝尔执掌的首份 13F 进行组合精简（专注保留 $461 亿美国运通主心骨），将约 $40 亿+ 规模的 V 与 MA 高位圆满清仓兑现。","summary_en":"Initiated in 2011 by Todd Combs during Durbin-Amendment regulatory fears, **Visa (V)** and **Mastercard (MA)** delivered >10x returns over 15 years as global cash-to-digital conversion compounded effortlessly. Taking zero credit risk on pure payment rails, Visa generated **$35.93B** in FY2025 net revenue and **$19.74B** in net income (**55.0% net profit margin!**), while Mastercard grew Q4 2025 net revenue +18% to $8.8B. In Q1 2026, as CEO Greg Abel streamlined 15 smaller positions to focus on $46.10B core holding American Express, Berkshire exited V and MA at peak valuations."},{"idx":47,"slug":"47_HIST_Salomon_Brothers","ticker":"ACQUIRED BY TRAVELERS (1997)","mono":"SALO","group":"historical","group_zh":"历史传奇与败局教训","group_en":"Historical Legends & Lessons","name_zh":"所罗门兄弟公司 Salomon Brothers","name_en":"Salomon Inc. / Salomon Brothers","short_zh":"所罗门兄弟 (Salomon)","short_en":"Salomon Brothers (1987–1997)","status_zh":"1991 国会证词千古名言：“亏钱可以理解，丢掉一丝一毫声誉我必严惩不贷！”","status_en":"1991 Congressional Testimony: 'Lose a Shred of Reputation and I Will Be Ruthless'","entry_yr":"1987.09 → 1997并入旅行者集团","val_or_gain_zh":"$7.0亿 9%优先股 → 翻倍全身而退","val_or_gain_en":"$700M 9% Pref → Saved & Doubled","core_metric_zh":"巴菲特临危挂帅 10个月","core_metric_en":"Buffett Interim Chairman (1991)","verdict_zh":"巴菲特人生最惊心动魄的 10 个月 —— 凭一己个人信誉从美国财政部刀下救活华尔街债券王","verdict_en":"Buffett's Most harrowing 10 Months: Saving Salomon with His Personal Integrity","summary_zh":"1987 年 9 月（黑色星期一前一个月），巴菲特以白衣骑士身份出资 **$7 亿美元认购所罗门兄弟 9% 可转换优先股**。然而 1991 年 8 月，所罗门债券交易主管保罗·莫泽尔违规操纵美国国债拍卖丑闻曝光且高管知情不报，美国财政部愤怒下令禁止所罗门参与国债投标——这等同于宣判这家高杠杆投行当天脑死亡！千钧一发之际，巴菲特飞赴纽约出任**临时董事长（年薪 1 美元）**，用毕生信誉向财政部长布雷迪担保并在国会留下传世训诫：**“为公司亏了钱，我会理解；但若让公司丢掉一丝一毫声誉，我将严惩不贷（Ruthless）！”** 财政部收回成命，所罗门绝境重生并于 1997 年以 **$90 亿美元**售予桑迪·威尔的旅行者集团（Travelers），伯克希尔最终翻倍获利退出！","summary_en":"In September 1987, Buffett invested **$700M in 9% convertible preferred stock** of bond powerhouse Salomon Brothers. Four years later in August 1991, rogue Treasury-auction bids and an executive cover-up prompted the U.S. Treasury to ban Salomon from auctions—an instant death sentence. Stepping in overnight as **Interim Chairman ($1/yr salary)**, Buffett staked his personal honor to persuade Treasury Secretary Nicholas Brady to reverse the ban and delivered his immortal Congressional testimony: *'Lose money for the firm, and I will be understanding; lose a shred of reputation for the firm, and I will be ruthless.'* Rescued from collapse, Salomon sold to Travelers Group for **$9B** in 1997."},{"idx":48,"slug":"48_HIST_Dexter_Shoe","ticker":"1993 STOCK SWAP DISASTER (归零教训)","mono":"DEXT","group":"historical","group_zh":"历史传奇与败局教训","group_en":"Historical Legends & Lessons","name_zh":"德克斯特鞋业公司 Dexter Shoe Company","name_en":"Dexter Shoe Company","short_zh":"德克斯特鞋业 (Dexter)","short_en":"Dexter Shoe (Worst Mistake)","status_zh":"巴菲特亲承“吉尼斯纪录级最惨败局” · 25,203股 BRK.A 换回归零（今值超 $185亿！）","status_en":"'Guinness Book Financial Disaster' · 25,203 BRK.A Shares (~$18.5B Today) for Zero","entry_yr":"1993 (换股并购) → 2001并入H.H.Brown归零","val_or_gain_zh":"$4.33亿换股 → 机会成本超 -$185亿!","val_or_gain_en":"-$18.5B+ Opportunity Cost Today!","core_metric_zh":"付出 25,203 股 BRK.A (~1.6%)","core_metric_en":"25,203 Class A Shares Given Away","verdict_zh":"双重致命错误叠加：把脆弱高利润误判为护城河 + 用极其珍贵的伯克希尔股票付账！","verdict_en":"Compounded Disaster: Mistaking Temporary Margin for a Moat + Paying in Berkshire Stock!","summary_zh":"如果只看一家公司来理解巴菲特如何从失败中进化，非 **德克斯特鞋业（Dexter Shoe）** 莫属！1993 年巴菲特被缅因州德克斯特鞋业亮眼的历史账面利润迷住了眼，不仅没有看出海外低工资国家进口鞋即将摧毁美国本土制鞋业，更为了迎合卖家免税诉求犯下不可饶恕的第二个大错——不用现金，而是掏出 **25,203 股伯克希尔 A 类股（当时值 $4.33 亿美元，约占整个伯克希尔 1.6%！）** 支付对价！短短数年内廉价进口鞋席卷全美，德克斯特利润从 $4,000 万跌向亏损关厂归零；而当年送出去的那 25,203 股 BRK.A，按 2026 年每股逾 $73.3 万美元计算，市值已高达惊人的 **$185 亿美元以上**！巴菲特自嘲：“这笔败局理应载入吉尼斯世界纪录！”","summary_en":"Buffett calls **Dexter Shoe** the *'most gruesome mistake'* of his entire career—one deserving a spot in the Guinness Book of World Records. In 1993, dazzled by Dexter's historical margins in Maine-made casual shoes, Buffett missed the tidal wave of low-cost foreign shoe imports *and* compounded the error catastrophically by paying not in cash, but with **25,203 Berkshire Class A shares** ($433M then, ~1.6% of all Berkshire!). Within years Dexter's competitive advantage vanished to **zero**—while those 25,203 BRK.A shares are worth **>$18.5B** at 2026 prices (~$733,500+/sh)!"}];

    const qPop = document.getElementById('quickJumpPopover');
    function renderQuickJump() {

      const isEn = B.getLang() === 'en';
      const matches = ALL_COMPANIES.filter(item => !q || (item.short_zh + ' ' + item.short_en + ' ' + item.ticker + ' ' + item.mono).toLowerCase().includes(q)).slice(0, 12);
      qPop.innerHTML = matches.map(item => `
        <a class="qj-item" href="./${B.esc(item.slug)}.html">
          <span><strong>${B.esc(isEn ? item.short_en : item.short_zh)}</strong></span>
          <span class="qj-sub mono">${B.esc(item.ticker)}</span>
        </a>
      `).join('');
      qPop.classList.toggle('open', matches.length > 0 && document.activeElement === qInput);
    }
    qInput.addEventListener('focus', renderQuickJump);
    qInput.addEventListener('input', renderQuickJump);
    document.addEventListener('click', (ev) => {
      if (!ev.target.closest('.quick-jump-wrap')) qPop.classList.remove('open');
    });
    document.addEventListener('keydown', (ev) => {
      if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k') {
        ev.preventDefault();
        qInput.focus();
      }
    });

    document.getElementById('langZhBtn').addEventListener('click', () => { B.setLang('zh'); mountHub(); });
    document.getElementById('langEnBtn').addEventListener('click', () => { B.setLang('en'); mountHub(); });
    document.getElementById('appbarThemeBtn').addEventListener('click', () => {
      B.setTheme(B.getTheme() === 'dark' ? 'light' : 'dark');
      mountHub();
    });
    document.getElementById('sidebarToggleBtn').addEventListener('click', () => {
      const s = document.getElementById('portalSearchInput');
      if (s) s.focus();
    });

    window.addEventListener('storage', (ev) => {
      if (ev.key === B.THEME_KEY && ev.newValue) { B.setTheme(ev.newValue); mountHub(); }
      if (ev.key === B.LANG_KEY && ev.newValue) { B.setLang(ev.newValue); mountHub(); }
    });
    window.addEventListener('resize', () => { if (activeRedraw) activeRedraw(); });
    window.addEventListener('scroll', () => {
      const maxS = document.documentElement.scrollHeight - window.innerHeight;
      const pct = maxS > 0 ? Math.min(100, (window.scrollY / maxS) * 100) : 0;
      document.getElementById('readingProgressBar').style.width = pct.toFixed(1) + '%';
    }, { passive: true });

    mountHub();
  })();

          ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>'
          : '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>';
      }

      function applyDetailTheme(mode, persist) {
        var isDark = (mode === 'dark');
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.setAttribute('data-mui-theme', isDark ? 'dark' : 'light');
        renderThemeIcon(isDark);
        if (persist) setStoreStr(THEME_KEY, isDark ? 'dark' : 'light');
        if (typeof window.updateChartsTheme === 'function') {
          try { window.updateChartsTheme(); } catch (e) {}
        }
      }

      /* Hook global toggleTheme() so sidebar button also syncs with homepage */
      var origToggleTheme = window.toggleTheme;
      window.toggleTheme = function () {
        var nextDark = !document.documentElement.classList.contains('dark');
        applyDetailTheme(nextDark ? 'dark' : 'light', true);
      };

      var origTextMap = new WeakMap();
      var netTransCache = {};
      var curLang = 'zh';

      function translateDynamicPattern(s, toEn) {
        if (toEn) {
          var m1 = s.match(/^已核查\s*(\d+)\s*\/\s*(\d+)\s*项\s*\((\d+%)\)$/);
          if (m1) return 'Verified ' + m1[1] + ' / ' + m1[2] + ' (' + m1[3] + ')';
          var m2 = s.match(/^概率：(\d+%)$/);
          if (m2) return 'Prob: ' + m2[1];
          var m3 = s.match(/^(\d+)\s*年$/);
          if (m3) return m3[1] + ' Yrs';
          var m4 = s.match(/^覆盖时间：(\d{4})年(\d{1,2})月$/);
          if (m4) return 'Coverage: ' + m4[1] + '-' + m4[2];
        } else {
          var e1 = s.match(/^Verified\s*(\d+)\s*\/\s*(\d+)\s*\((\d+%)\)$/);
          if (e1) return '已核查 ' + e1[1] + ' / ' + e1[2] + ' 项 (' + e1[3] + ')';
          var e2 = s.match(/^Prob:\s*(\d+%)$/);
          if (e2) return '概率：' + e2[1];
          var e3 = s.match(/^(\d+)\s*Yrs$/);
          if (e3) return e3[1] + ' 年';
          var e4 = s.match(/^Coverage:\s*(\d{4})-(\d{1,2})$/);
          if (e4) return '覆盖时间：' + e4[1] + '年' + e4[2] + '月';
        }
        return null;
      }

      function maybeTranslateRemainingOnline(nodesToTranslate) {
        if (!nodesToTranslate.length || typeof window.fetch !== 'function') return;
        if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
        var batchSize = 18;
        var idx = 0;
        function nextBatch() {
          if (curLang !== 'en' || idx >= nodesToTranslate.length) return;
          var slice = nodesToTranslate.slice(idx, idx + batchSize);
          idx += batchSize;
          var joined = slice.map(function (it) { return it.zh; }).join('\n====\n');
          var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
          var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 3500) : 0;
          window.fetch(
            'https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=en&dt=t&q=' + encodeURIComponent(joined),
            ctrl ? { signal: ctrl.signal } : {}
          ).then(function (r) {
            if (timer) clearTimeout(timer);
            return r.ok ? r.json() : null;
          }).then(function (data) {
            if (!data || !Array.isArray(data[0]) || curLang !== 'en') return;
            var fullEn = data[0].map(function (seg) { return seg && seg[0] ? seg[0] : ''; }).join('');
            var parts = fullEn.split(/\s*====\s*/);
            if (parts.length === slice.length) {
              for (var k = 0; k < slice.length; k++) {
                var enTxt = parts[k].trim();
                if (enTxt) {
                  netTransCache[slice[k].zh] = enTxt;
                  if (curLang === 'en') slice[k].node.nodeValue = slice[k].lead + enTxt + slice[k].trail;
                }
              }
            }
            nextBatch();
          }).catch(function () {
            if (timer) clearTimeout(timer);
          });
        }
        nextBatch();
      }

      function applyDetailLang(lang, persist) {
        curLang = (lang === 'en') ? 'en' : 'zh';
        var en = (curLang === 'en');
        document.documentElement.setAttribute('lang', en ? 'en' : 'zh-CN');
        document.documentElement.setAttribute('data-lang', curLang);

        var zhB = document.getElementById('portalDetailZhBtn');
        var enB = document.getElementById('portalDetailEnBtn');
        if (zhB && enB) {
          zhB.classList.toggle('active', !en);
          enB.classList.toggle('active', en);
          zhB.setAttribute('aria-pressed', !en ? 'true' : 'false');
          enB.setAttribute('aria-pressed', en ? 'true' : 'false');
        }
        var thB = document.getElementById('portalDetailThemeBtn');
        if (thB) {
          thB.setAttribute('title', en ? 'Toggle Light / Dark theme' : '切换浅色 / 深色主题');
          thB.setAttribute('aria-label', en ? 'Toggle color theme' : '切换深浅色主题');
        }

        var tagged = document.querySelectorAll('[data-i18n-zh][data-i18n-en]');
        for (var d = 0; d < tagged.length; d++) {
          tagged[d].textContent = en ? tagged[d].getAttribute('data-i18n-en') : tagged[d].getAttribute('data-i18n-zh');
        }

        var cjkRe = /[\u4e00-\u9fff]/;
        var pendingOnline = [];
        var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
        var n;
        while ((n = walker.nextNode())) {
          var p = n.parentElement;
          if (!p) continue;
          var tn = p.tagName;
          if (tn === 'SCRIPT' || tn === 'STYLE' || p.closest('#portalDetailLangSwitch') || p.closest('[data-i18n-zh]')) continue;
          var raw = n.nodeValue || '';
          var trimmed = raw.replace(/\s+/g, ' ').trim();
          if (!trimmed) continue;

          if (!origTextMap.has(n) && cjkRe.test(trimmed)) {
            origTextMap.set(n, raw);
          }

          var lead = (raw.match(/^\s*/) || [''])[0];
          var trail = (raw.match(/\s*$/) || [''])[0];

          if (en) {
            var baseRaw = origTextMap.has(n) ? origTextMap.get(n) : raw;
            var baseTrim = baseRaw.replace(/\s+/g, ' ').trim();
            var hit = zh2en[baseTrim] || translateDynamicPattern(baseTrim, true) || netTransCache[baseTrim];
            if (hit) {
              n.nodeValue = lead + hit + trail;
            } else if (cjkRe.test(baseTrim) && baseTrim.length >= 2) {
              pendingOnline.push({ node: n, zh: baseTrim, lead: lead, trail: trail });
            }
          } else {
            if (origTextMap.has(n)) {
              n.nodeValue = origTextMap.get(n);
            } else {
              var rev = en2zh[trimmed] || translateDynamicPattern(trimmed, false);
              if (rev) n.nodeValue = lead + rev + trail;
            }
          }
        }

        if (persist) setStoreStr(LANG_KEY, curLang);
        if (en && pendingOnline.length) {
          maybeTranslateRemainingOnline(pendingOnline);
        }
      }

      function initDetailPortalSync() {
        var savedTheme = getStoreStr(THEME_KEY, 'light');
        applyDetailTheme(savedTheme === 'dark' ? 'dark' : 'light', false);

        var savedLang = getStoreStr(LANG_KEY, 'zh');
        applyDetailLang(savedLang === 'en' ? 'en' : 'zh', false);

        var tBtn = document.getElementById('portalDetailThemeBtn');
        if (tBtn) {
          tBtn.addEventListener('click', function () {
            var nextDark = !document.documentElement.classList.contains('dark');
            applyDetailTheme(nextDark ? 'dark' : 'light', true);
          });
        }
        var zBtn = document.getElementById('portalDetailZhBtn');
        var eBtn = document.getElementById('portalDetailEnBtn');
        if (zBtn) zBtn.addEventListener('click', function () { applyDetailLang('zh', true); });
        if (eBtn) eBtn.addEventListener('click', function () { applyDetailLang('en', true); });

        window.addEventListener('storage', function (ev) {
          if (ev.key === THEME_KEY && ev.newValue) {
            var nt = String(ev.newValue).replace(/^"|"$/g, '');
            if (nt === 'light' || nt === 'dark') applyDetailTheme(nt, false);
          } else if (ev.key === LANG_KEY && ev.newValue) {
            var nl = String(ev.newValue).replace(/^"|"$/g, '');
            if (nl === 'zh' || nl === 'en') applyDetailLang(nl, false);
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initDetailPortalSync);
      } else {
        initDetailPortalSync();
      }
    })();
  </script>

<!DOCTYPE html>
<html lang="zh-CN" data-mui-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>数据中心 · Research & Docs</title>
  <style>
    /* ==========================================================================
       MUI Official Website Design System (https://mui.com/)
       Centered AppBar Search + Collapsible Directory Index Drawer + Underline Tabs
       ========================================================================== */
    :root,
    html[data-mui-theme="light"] {
      --mui-bg-canvas: #F8FAFC;
      --mui-bg-glow: radial-gradient(ellipse 85% 340px at 50% -130px, rgba(0, 115, 230, 0.065), rgba(248, 250, 252, 0) 75%);
      --mui-bg-paper: #FFFFFF;
      --mui-bg-popover: #FFFFFF;
      --mui-bg-subtle: #F1F5F9;
      --mui-bg-input: #F8FAFC;
      --mui-appbar-bg: rgba(255, 255, 255, 0.88);
      --mui-primary: #0073E6;
      --mui-primary-solid: #0073E6;
      --mui-primary-hover: #0059B2;
      --mui-primary-tint: rgba(0, 115, 230, 0.08);
      --mui-primary-border: rgba(0, 115, 230, 0.28);
      --mui-text-primary: #0F172A;
      --mui-text-secondary: #475569;
      --mui-text-muted: #64748B;
      --mui-border: #E2E8F0;
      --mui-border-hover: #CBD5E1;
      --mui-action-hover: #F1F5F9;
      --mui-mark-bg: #FEF08A;
      --mui-mark-text: #854D0E;
      --mui-shadow-card: 0 2px 10px rgba(15, 23, 42, 0.04);
      --mui-shadow-seg: 0 1px 3px rgba(15, 23, 42, 0.10), 0 1px 2px rgba(15, 23, 42, 0.06);
      --mui-shadow-popover: 0 20px 44px -8px rgba(15, 23, 42, 0.16), 0 4px 14px -2px rgba(15, 23, 42, 0.07);
    }

    html[data-mui-theme="dark"] {
      --mui-bg-canvas: #090D16;
      --mui-bg-glow: radial-gradient(ellipse 85% 360px at 50% -120px, rgba(0, 115, 230, 0.20), rgba(9, 13, 22, 0) 75%);
      --mui-bg-paper: #0F1623;
      --mui-bg-popover: #111927;
      --mui-bg-subtle: rgba(19, 29, 47, 0.82);
      --mui-bg-input: rgba(15, 22, 35, 0.95);
      --mui-appbar-bg: rgba(9, 13, 22, 0.86);
      --mui-primary: #3399FF;
      --mui-primary-solid: #0073E6;
      --mui-primary-hover: #0059B2;
      --mui-primary-tint: rgba(51, 153, 255, 0.14);
      --mui-primary-border: rgba(51, 153, 255, 0.34);
      --mui-text-primary: #F8FAFC;
      --mui-text-secondary: #94A3B8;
      --mui-text-muted: #64748B;
      --mui-border: rgba(255, 255, 255, 0.09);
      --mui-border-hover: rgba(51, 153, 255, 0.38);
      --mui-action-hover: rgba(255, 255, 255, 0.05);
      --mui-mark-bg: rgba(250, 204, 21, 0.24);
      --mui-mark-text: #FDE047;
      --mui-shadow-card: 0 4px 20px rgba(0, 0, 0, 0.32);
      --mui-shadow-seg: 0 1px 4px rgba(0, 0, 0, 0.45);
      --mui-shadow-popover: 0 24px 48px rgba(0, 0, 0, 0.65);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "General Sans", "Inter", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.55;
      background-color: var(--mui-bg-canvas);
      background-image: var(--mui-bg-glow);
      background-repeat: no-repeat;
      color: var(--mui-text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .mono {
      font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .hidden {
      display: none !important;
    }

    mark {
      background-color: var(--mui-mark-bg);
      color: var(--mui-mark-text);
      padding: 0 3px;
      border-radius: 4px;
      font-weight: 600;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, select {
      font-family: inherit;
      color: inherit;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.28); border-radius: 3px; }

    /* ==========================================================================
       mui.com Symmetric Sticky AppBar (Left Drawer Icon · Centered Search · Theme)
       ========================================================================== */
    .MuiAppBar {
      position: sticky;
      top: 0;
      z-index: 1150;
      background: var(--mui-appbar-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--mui-border);
    }

    .MuiAppBar-inner {
      max-width: 1560px;
      margin: 0 auto;
      min-height: 60px;
      padding: 8px 22px;
      display: grid;
      grid-template-columns: 1fr minmax(260px, 520px) 1fr;
      align-items: center;
      gap: 12px;
    }

    .MuiAppBar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-self: start;
    }

    .MuiAppBar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-self: end;
    }

    .MuiSearchBox {
      width: 100%;
      max-width: 520px;
      justify-self: center;
      height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--mui-border);
      background: var(--mui-bg-input);
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.03);
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      transition: border-color 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
    }

    .MuiSearchBox:hover {
      border-color: var(--mui-border-hover);
      background: var(--mui-bg-paper);
    }

    .MuiSearchBox:focus-within {
      background: var(--mui-bg-paper);
      border-color: var(--mui-primary);
      box-shadow: 0 0 0 3px var(--mui-primary-tint);
    }

    .MuiSearchBox-input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font-size: 0.86rem;
      color: var(--mui-text-primary);
    }

    .MuiSearchBox-input::placeholder {
      color: var(--mui-text-muted);
    }

    .MuiSearchBox-clear {
      height: 22px;
      padding: 0 7px;
      border-radius: 6px;
      border: 1px solid var(--mui-border);
      background: var(--mui-bg-subtle);
      color: var(--mui-text-secondary);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 130ms ease;
    }

    .MuiSearchBox-clear:hover {
      color: var(--mui-primary);
      border-color: var(--mui-primary-border);
    }

    .MuiKbd {
      font-size: 0.69rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid var(--mui-border);
      background: var(--mui-bg-paper);
      color: var(--mui-text-muted);
      flex-shrink: 0;
    }

    .MuiIconBtn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--mui-border);
      background: var(--mui-bg-paper);
      color: var(--mui-text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 150ms ease;
      flex-shrink: 0;
    }

    .MuiIconBtn:hover,
    .MuiIconBtn.active {
      color: var(--mui-primary);
      border-color: var(--mui-primary-border);
      background: var(--mui-primary-tint);
    }

    .MuiBtn {
      height: 32px;
      padding: 0 11px;
      border-radius: 8px;
      border: 1px solid var(--mui-border);
      background: var(--mui-bg-subtle);
      color: var(--mui-text-primary);
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 150ms ease;
    }

    .MuiBtn:hover {
      border-color: var(--mui-border-hover);
      background: var(--mui-action-hover);
    }

    .MuiBtn-primary {
      background: var(--mui-primary-solid);
      border-color: var(--mui-primary-solid);
      color: #FFFFFF;
    }

    .MuiBtn-primary:hover {
      background: var(--mui-primary-hover);
      border-color: var(--mui-primary-hover);
      color: #FFFFFF;
    }

    /* ==========================================================================
       Hidden-by-Default Unified Directory Index & Navigation Drawer (#leftDrawer)
       ========================================================================== */
    .MuiDrawer-left {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(340px, 88vw);
      height: 100vh;
      height: 100dvh;
      padding-top: env(safe-area-inset-top, 0px);
      background: var(--mui-bg-paper);
      border-right: 1px solid var(--mui-border);
      box-shadow: var(--mui-shadow-popover);
      z-index: 1320;
      transform: translateX(-104%);
      transition: transform 220ms cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    .MuiDrawer-left.open {
      transform: translateX(0);
    }

    .MuiDrawer-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--mui-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .MuiDrawer-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .MuiDrawer-logoMark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--mui-primary-tint);
      border: 1px solid var(--mui-primary-border);
      color: var(--mui-primary-solid);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .MuiDrawer-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px calc(28px + env(safe-area-inset-bottom, 0px));
      -webkit-overflow-scrolling: touch;
    }

    .MuiDrawerSection {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--mui-border);
    }

    .MuiDrawerSection:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    .MuiDrawerAccBtn {
      width: 100%;
      padding: 7px 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--mui-text-muted);
      font-size: 0.73rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      transition: background 130ms ease, color 130ms ease;
    }

    .MuiDrawerAccBtn:hover {
      background: var(--mui-action-hover);
      color: var(--mui-text-primary);
    }

    .MuiDrawerAccBadge {
      font-size: 0.69rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 99px;
      background: var(--mui-bg-subtle);
      color: var(--mui-text-secondary);
      border: 1px solid var(--mui-border);
    }

    .MuiDrawerLinkList {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 4px;
    }

    .MuiDrawerNavItem {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 9px;
      border: 1px solid transparent;
      background: transparent;
      text-align: left;
      width: 100%;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease;
    }

    .MuiDrawerNavItem:hover {
      background: var(--mui-action-hover);
      border-color: var(--mui-border);
    }

    .MuiDrawerNavIcon {
      width: 22px;
      height: 22px;
      margin-top: 1px;
      border-radius: 6px;
      color: var(--mui-primary);
      background: var(--mui-primary-tint);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .MuiDrawerNavText {
      min-width: 0;
      flex: 1;
    }

    .MuiDrawerNavTitle {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--mui-text-primary);
      line-height: 1.35;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .MuiDrawerNavItem:hover .MuiDrawerNavTitle {
      color: var(--mui-primary);
    }

    .MuiDrawerNavDesc {
      font-size: 0.75rem;
      color: var(--mui-text-secondary);
      line-height: 1.42;
      margin-top: 2px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .MuiDrawerFilterBox {
      margin: 6px 4px 8px;
      height: 32px;
      padding: 0 9px;
      border-radius: 8px;
      border: 1px solid var(--mui-border);
      background: var(--mui-bg-input);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .MuiDrawerFilterBox:focus-within {
      border-color: var(--mui-primary);
      background: var(--mui-bg-paper);
    }

    .MuiDrawerFilterInput {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font-size: 0.79rem;
      color: var(--mui-text-primary);
    }

    .MuiNavTree-list {
      list-style: none;
    }

    .MuiNavTree-sub {
      list-style: none;
      padding-left: 12px;
      margin-left: 8px;
      border-left: 1px solid var(--mui-border);
    }

    .MuiNavTree-btn,
    .MuiNavTree-leaf {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      color: var(--mui-text-secondary);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      cursor: pointer;
      transition: all 130ms ease;
    }

    .MuiNavTree-btn:hover,
    .MuiNavTree-leaf:hover {
      background: var(--mui-action-hover);
      color: var(--mui-text-primary);
    }

    .MuiNavTree-btn.active {
      background: var(--mui-primary-tint);
      color: var(--mui-primary);
      font-weight: 600;
    }

    /* ==========================================================================
       Main Workspace & Clean mui.com Filter Bar (Underline Tabs + Compact Actions)
       ========================================================================== */
    .MuiMain {
      width: 100%;
    }

    .MuiContainer {
      max-width: 1560px;
      margin: 0 auto;
      padding: 12px 22px calc(56px + env(safe-area-inset-bottom, 0px));
    }

    .MuiFilterBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--mui-border);
      margin-bottom: 18px;
      min-height: 44px;
    }

    /* Left: mui.com Borderless Underline Tabs */
    .MuiTabsBar {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
      flex: 1 1 auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .MuiTabsBar::-webkit-scrollbar {
      display: none;
    }

    .MuiTab {
      position: relative;
      height: 42px;
      padding: 0 11px;
      border: none;
      background: transparent;
      color: var(--mui-text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      border-radius: 8px 8px 0 0;
      transition: color 140ms ease, background-color 140ms ease;
    }

    .MuiTab:hover {
      color: var(--mui-text-primary);
      background: var(--mui-action-hover);
    }

    .MuiTab.active {
      color: var(--mui-primary);
      font-weight: 600;
    }

    .MuiTab.active::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 0;
      height: 2.5px;
      border-radius: 2px 2px 0 0;
      background: var(--mui-primary-solid);
    }

    .MuiTab-count {
      font-size: 0.7rem;
      font-weight: 600;
      line-height: 1.2;
      padding: 1px 6px;
      border-radius: 99px;
      background: var(--mui-bg-subtle);
      color: var(--mui-text-muted);
      transition: background-color 140ms ease, color 140ms ease;
    }

    .MuiTab.active .MuiTab-count {
      background: var(--mui-primary-tint);
      color: var(--mui-primary);
    }

    /* Right: Compact Selects + Segmented View ToggleButtonGroup */
    .MuiFilterRight {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      padding-bottom: 4px;
    }

    .MuiSelectWrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-width: 0;
    }

    .MuiSelect {
      appearance: none;
      -webkit-appearance: none;
      height: 32px;
      padding: 0 26px 0 10px;
      border-radius: 8px;
      border: 1px solid var(--mui-border);
      background: var(--mui-bg-paper);
      color: var(--mui-text-secondary);
      font-size: 0.79rem;
      font-weight: 500;
      outline: none;
      cursor: pointer;
      max-width: 176px;
      min-width: 0;
      text-overflow: ellipsis;
      transition: border-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
    }

    .MuiSelect:hover {
      border-color: var(--mui-border-hover);
      color: var(--mui-text-primary);
    }

    .MuiSelect:focus {
      border-color: var(--mui-primary);
      color: var(--mui-text-primary);
      box-shadow: 0 0 0 3px var(--mui-primary-tint);
    }

    .MuiSelectChevron {
      position: absolute;
      right: 8px;
      pointer-events: none;
      color: var(--mui-text-muted);
      display: inline-flex;
      align-items: center;
    }

    .MuiToggleGroup {
      display: inline-flex;
      align-items: center;
      background: var(--mui-bg-subtle);
      padding: 2px;
      border-radius: 9px;
      border: 1px solid var(--mui-border);
      height: 32px;
    }

    .MuiToggleBtn {
      height: 26px;
      padding: 0 9px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--mui-text-muted);
      font-size: 0.77rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 140ms ease;
    }

    .MuiToggleBtn:hover {
      color: var(--mui-text-primary);
    }

    .MuiToggleBtn.active {
      background: var(--mui-bg-paper);
      color: var(--mui-primary);
      box-shadow: var(--mui-shadow-seg);
    }

    /* ==========================================================================
       Cards Grid (MUI Paper Cards)
       ========================================================================== */
    .MuiCardGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
      gap: 16px;
    }

    .MuiCard {
      min-width: 0;
      background: var(--mui-bg-paper);
      border: 1px solid var(--mui-border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 170ms ease, border-color 170ms ease;
      box-shadow: var(--mui-shadow-card);
    }

    .MuiCard:hover {
      transform: translateY(-2px);
      border-color: var(--mui-primary-border);
    }

    .MuiCard-banner {
      padding: 12px 15px 10px;
      border-bottom: 1px solid var(--mui-border);
      background: linear-gradient(135deg, rgba(0, 115, 230, 0.08), transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .cat-SeniorExecutive .MuiCard-banner { background: linear-gradient(135deg, rgba(14, 165, 233, 0.11), transparent); }
    .cat-Company .MuiCard-banner { background: linear-gradient(135deg, rgba(0, 115, 230, 0.12), transparent); }
    .cat-CorporateCulture .MuiCard-banner { background: linear-gradient(135deg, rgba(139, 92, 246, 0.11), transparent); }
    .cat-software .MuiCard-banner { background: linear-gradient(135deg, rgba(16, 185, 129, 0.11), transparent); }
    .cat-hardware .MuiCard-banner { background: linear-gradient(135deg, rgba(245, 158, 11, 0.11), transparent); }
    .cat-patent .MuiCard-banner { background: linear-gradient(135deg, rgba(236, 72, 153, 0.11), transparent); }

    .MuiTickerBadge {
      display: inline-flex;
      align-items: center;
      font-size: 0.73rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--mui-primary-tint);
      color: var(--mui-primary);
      border: 1px solid var(--mui-primary-border);
      flex-shrink: 0;
    }

    .MuiCatTag {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--mui-border);
      color: var(--mui-text-secondary);
      background: var(--mui-bg-subtle);
      flex-shrink: 0;
    }

    .MuiCard-body {
      padding: 13px 15px;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .MuiCard-title {
      font-size: 0.96rem;
      font-weight: 700;

        var idx = u.indexOf('/docs/');
        if (u.indexOf('file://') === 0 && idx !== -1) {

      function resolveNavLinkAction(lk) {

        var proto = (window.location.protocol || '').toLowerCase();
        var pathName = window.location.pathname || '';
        if (proto === 'file:') {
          /* Inside .../docs/index.html -> relative path resolves to exact local file:///.../docs/... and survives folder moves */
          if (rel && pathName.indexOf('/docs/') !== -1) {
            return { mode: 'href', href: encodeRelPath(rel), newTab: lk.newTab !== false };
          }
          /* Standalone file:// opened outside docs/ -> jump straight to explicit file:///Users/an/... URL */
          return { mode: 'href', href: lk.url, newTab: lk.newTab !== false };
        }
        if (isDirectRelEnv() && rel) {
          return { mode: 'href', href: encodeRelPath(rel), newTab: lk.newTab !== false };
        }
        if (!isDirectRelEnv() && matchedItem) {
          return { mode: 'reader', itemId: matchedItem.id };

        if (!isDirectRelEnv() && String(lk.url || '').indexOf('file://') === 0 && matchedItem && matchedItem.driveUrl) {

      /* ========================================================================

      function getTokens() {
        var q = state.query.trim().toLowerCase();
        return q ? q.split(/\s+/).filter(Boolean) : [];

      function highlight(text, tokens) {
        var safe = esc(text);
        if (!tokens || !tokens.length) return safe;
        var sorted = tokens.slice().sort(function (a, b) { return b.length - a.length; }).map(function (t) {
          return esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }).filter(Boolean);
        if (!sorted.length) return safe;
        try {
          return safe.replace(new RegExp('(' + sorted.join('|') + ')', 'gi'), '<mark>$1</mark>');
        } catch (err) {
          return safe;
        }
      }

      function extractContextSnippets(it, tokens, maxSnippets) {
        if (!tokens.length) return [];
        var body = it._bodyText || it.summary || '';
        var lower = it._bodyLower || body.toLowerCase();
        if (!body) return [];

        var snippets = [];
        var usedRanges = [];
        for (var tIdx = 0; tIdx < tokens.length; tIdx++) {
          var tok = tokens[tIdx];
          var searchPos = 0;
          while (snippets.length < maxSnippets && searchPos < lower.length) {
            var pos = lower.indexOf(tok, searchPos);
            if (pos === -1) break;
            searchPos = pos + Math.max(1, tok.length);
            var overlaps = usedRanges.some(function (r) { return Math.abs(r - pos) < 90; });
            if (overlaps) continue;
            usedRanges.push(pos);
            var start = Math.max(0, pos - 34);
            var end = Math.min(body.length, pos + tok.length + 68);
            var seg = (start > 0 ? '…' : '') + body.slice(start, end).trim() + (end < body.length ? '…' : '');
            snippets.push(seg);
          }
        }
        return snippets;
      }

      function countOccurrences(hay, tok) {
        if (!hay || !tok) return 0;
        var c = 0;
        var pos = 0;
        while (c < 99) {
          var idx = hay.indexOf(tok, pos);
          if (idx === -1) break;
          c += 1;
          pos = idx + tok.length;
        }
        return c;
      }

      function filterAndRankItems() {
        var tokens = getTokens();
        var results = [];

        for (var i = 0; i < contentItems.length; i++) {
          var it = contentItems[i];
          if (state.category === 'FAV') {
            if (!state.favorites[it.id]) continue;
          } else if (state.category !== 'ALL' && it.category !== state.category && it.fileType !== state.category) {
            continue;
          }
          if (state.company !== 'ALL' && it.company !== state.company) continue;

          var score = 0;
          var hitCount = 0;
          if (tokens.length) {
            var matchedAll = true;
            for (var k = 0; k < tokens.length; k++) {
              var tk = tokens[k];
              if (it._allHay.indexOf(tk) === -1) {
                matchedAll = false;
                break;
              }
              var tHits = countOccurrences(it._titleHay, tk);
              var hHits = countOccurrences(it._headingHay, tk);
              var bHits = countOccurrences(it._bodyLower, tk);
              hitCount += tHits + hHits + bHits;
              score += tHits * 30 + hHits * 10 + Math.min(25, bHits * 2);
            }
            if (!matchedAll) continue;
          }
          it._score = score;
          it._hitCount = hitCount;
          results.push(it);
        }

        results.sort(function (a, b) {
          if (state.sort === 'relevance' && tokens.length) {
            if (b._score !== a._score) return b._score - a._score;
          }
          if (state.sort === 'time_desc' || (state.sort === 'relevance' && !tokens.length)) {
            var cmpT = String(b.modifiedTime || '').localeCompare(String(a.modifiedTime || ''));
            if (cmpT !== 0) return cmpT;
          }
          if (state.sort === 'company_asc') {
            var cmpC = String(a.company).localeCompare(String(b.company), 'zh-CN');
            if (cmpC !== 0) return cmpC;
          }
          return String(a.title).localeCompare(String(b.title), 'zh-CN');
        });

        return results;
      }

          }
        });

        var favCount = scopedPool.filter(function (it) { return !!state.favorites[it.id]; }).length;
        counts.FAV = favCount;

        var baseOrder = ['ALL', 'SeniorExecutive', 'Company', 'CorporateCulture', 'software', 'hardware', 'patent'];
        if (counts.PhysicalStores) baseOrder.push('PhysicalStores');
        if (counts.RootFile) baseOrder.push('RootFile');
        extraCats.forEach(function (ec) { baseOrder.push(ec); });
        Object.keys(extraTypes).forEach(function (ft) {
          counts[ft] = extraTypes[ft];
          baseOrder.push(ft);
        });
        if (favCount > 0 || state.category === 'FAV') baseOrder.push('FAV');

        bar.innerHTML = baseOrder.map(function (cat) {
          var cnt = counts[cat] || 0;
          var label = catLabel(cat);
          var isAct = state.category === cat;
          var activeCls = isAct ? ' active' : '';
          return '<button type="button" class="MuiTab' + activeCls + '" role="tab" aria-selected="' + (isAct ? 'true' : 'false') + '" data-cat="' + esc(cat) + '">' +
            '<span>' + esc(label) + '</span>' +
            '<span class="MuiTab-count mono">' + cnt + '</span>' +
          '</button>';
        }).join('');
      }

      function countFolderItems(fid) {
        var n = folderNodes[fid];
        if (!n) return 0;
        var total = n.files.length;
        n.children.forEach(function (cid) { total += countFolderItems(cid); });
        return total;
      }

      function renderMatchedFoldersBar(tokens) {
        var banner = document.getElementById('matchedFoldersBanner');
        if (!banner) return;
        if (!tokens.length) {
          banner.classList.add('hidden');
          banner.innerHTML = '';
          return;
        }
        var rootId = (CATALOG.root && CATALOG.root.id) || 'root_docs';
        var matched = [];
        Object.keys(folderNodes).forEach(function (fid) {
          if (fid === rootId) return;
          var fn = folderNodes[fid];
          var hay = (fn.name + ' ' + (fn.label || '') + ' ' + (fn.ticker || '') + ' ' + fn.relPath).toLowerCase();
          if (tokens.every(function (t) { return hay.indexOf(t) !== -1; })) {
            matched.push(fn);
          }
        });
        if (!matched.length) {
          banner.classList.add('hidden');
          return;
        }
        matched.sort(function (a, b) { return a.level - b.level; });
        banner.classList.remove('hidden');
        banner.innerHTML = '<div style="padding:10px 12px;border-radius:12px;background:var(--mui-bg-paper);border:1px solid var(--mui-primary-border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
          '<span style="font-size:0.79rem;font-weight:700;color:var(--mui-primary);">' + (isEn() ? '📁 Matched Folders:' : '📁 命中目录：') + '</span>' +
          matched.slice(0, 8).map(function (fn) {
            return '<button type="button" class="MuiBtn" style="height:28px;font-size:0.76rem;" data-jump-folder="' + esc(fn.id) + '">' +
              highlight(fn.relPath, tokens) + ' <span class="mono" style="opacity:0.7;">(' + countFolderItems(fn.id) + ')</span>' +
            '</button>';
          }).join('') +
        '</div>';
      }

      function renderCardHtml(it, tokens) {
        var href = resolveItemHref(it);
        var cLbl = catLabel(it.category);
        var compDisp = compLabel(it.company, it.companyLabel);
        var dateStr = String(it.modifiedTime || '').slice(0, 10) || '2026-11';
        var isFav = !!state.favorites[it.id];
        var isExp = !!state.expandedCards[it.id];
        var snippets = extractContextSnippets(it, tokens, 2);
        var fileBadge = (it.fileType && it.fileType !== 'HTML') ? (' · ' + it.fileType) : '';
        var wordStr = fmtWords(it.wordCount);

        var snippetsHtml = snippets.map(function (sn) {
          return '<div class="MuiHitSnippet">' + (isEn() ? 'Matched text: ' : '命中正文：') + highlight(sn, tokens) + '</div>';
        }).join('');

        var outlineHtml = '';
        if (isExp) {
          var heads = (it.headings || []).slice(0, 8);
          outlineHtml = '<div class="MuiCard-Outline">' +
            '<div style="font-weight:700;color:var(--mui-text-primary);">' + (isEn() ? 'Section Outline (' : '章节大纲 (') + (it.headings ? it.headings.length : 0) + (isEn() ? '):' : ')：') + '</div>' +
            (heads.length
              ? ('<ul>' + heads.map(function (h) { return '<li>' + highlight(h, tokens) + '</li>'; }).join('') + '</ul>')
              : '<div style="margin:6px 0 10px;color:var(--mui-text-muted);">' + (isEn() ? 'No structured headings available' : '暂无结构化标题大纲') + '</div>') +
            '<div style="display:flex;justify-content:flex-end;gap:8px;">' +
              '<button type="button" class="MuiBtn" data-open-reader="' + esc(it.id) + '">' + (isEn() ? 'Preview' : '速览') + '</button>' +
              '<a class="MuiBtn MuiBtn-primary" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + (isEn() ? 'Open ↗' : '打开 ↗') + '</a>' +
            '</div>' +
          '</div>';
        }

        return '<article class="MuiCard cat-' + esc(it.category) + '" data-card-id="' + esc(it.id) + '">' +
          '<div class="MuiCard-banner">' +
            '<div style="display:flex;align-items:center;gap:6px;min-width:0;">' +
              '<span class="MuiTickerBadge mono">' + highlight(it.ticker || it.company, tokens) + '</span>' +
              '<span style="font-size:0.78rem;font-weight:600;color:var(--mui-text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + highlight(compDisp, tokens) + '</span>' +
            '</div>' +
            '<span class="MuiCatTag">' + esc(cLbl + fileBadge) + '</span>' +
          '</div>' +

          '<div class="MuiCard-body">' +
            '<div class="MuiCard-title" data-open-reader="' + esc(it.id) + '">' + highlight(it.title, tokens) + '</div>' +
            '<div class="MuiCard-sub mono">' +
              '<span>' + esc(dateStr) + '</span>' +
              (wordStr ? ('<span>· ' + esc(wordStr) + '</span>') : '') +
              (tokens.length && it._hitCount ? ('<span style="color:var(--mui-primary);font-weight:700;">· ' + (isEn() ? (it._hitCount + ' matches') : ('命中 ' + it._hitCount + ' 处')) + '</span>') : '') +
              '<span style="flex:1 1 100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:0.85;">' + highlight(it.relPath, tokens) + '</span>' +
            '</div>' +
            '<div class="MuiCard-summary">' + highlight(it.summary || '', tokens) + '</div>' +
            snippetsHtml +
          '</div>' +

          '<div class="MuiCard-footer">' +
            '<div class="MuiCard-actions">' +
              '<button type="button" class="MuiIconBtn" style="width:32px;height:32px;' + (isFav ? 'color:#EF4444;border-color:rgba(239,68,68,0.4);' : '') + '" data-fav-id="' + esc(it.id) + '" title="' + (isEn() ? 'Bookmark' : '收藏') + '">' + (isFav ? '♥' : '♡') + '</button>' +
              '<button type="button" class="MuiBtn" style="height:32px;padding:0 10px;font-size:0.77rem;" data-open-reader="' + esc(it.id) + '">' + (isEn() ? 'Preview' : '速览') + '</button>' +
            '</div>' +
            '<div class="MuiCard-actions">' +
              '<button type="button" class="MuiBtn" style="height:32px;padding:0 9px;font-size:0.77rem;" data-toggle-outline="' + esc(it.id) + '">' + (isExp ? (isEn() ? 'Hide ▲' : '收起 ▲') : (isEn() ? 'Outline ▼' : '大纲 ▼')) + '</button>' +
              '<a class="MuiBtn MuiBtn-primary" style="height:32px;padding:0 12px;font-size:0.77rem;" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + (isEn() ? 'Open ↗' : '打开 ↗') + '</a>' +
            '</div>' +
          '</div>' +
          outlineHtml +
        '</article>';
      }

      function renderCardsView(list, tokens) {
        var wrap = document.getElementById('viewCards');
        if (!wrap) return;
        if (!list.length) {
          renderedCount = 0;
          wrap.innerHTML = '<div style="padding:48px 18px;text-align:center;background:var(--mui-bg-paper);border:1px solid var(--mui-border);border-radius:14px;">' +
            '<div style="font-size:1rem;font-weight:700;margin-bottom:8px;">' + (isEn() ? 'No matching documents found' : '没有找到匹配内容') + '</div>' +
            '<button type="button" class="MuiBtn MuiBtn-primary" data-reset-filters="1">' + (isEn() ? 'Reset Filters' : '重置筛选') + '</button>' +
          '</div>';
          return;
        }

        var initCount = Math.min(list.length, Math.max(PAGE_SIZE, state.visibleCount));
        renderedCount = initCount;
        var slice = list.slice(0, initCount);

        wrap.innerHTML = '<div id="cardsGridEl" class="MuiCardGrid">' +
          slice.map(function (it) { return renderCardHtml(it, tokens); }).join('') +
        '</div>' +
        '<div id="cardsSentinel" class="MuiLoadMore"></div>';

        updateSentinelFooter();
        setupIntersectionSentinel();
      }

      function updateSentinelFooter() {
        var foot = document.getElementById('cardsSentinel');
        if (!foot) return;
        var total = currentResults.length;
        if (renderedCount < total) {
          var rem = Math.min(PAGE_SIZE, total - renderedCount);
          foot.innerHTML = '<button type="button" class="MuiBtn" data-load-more="1">' +
            (isEn() ? ('Showing ' + renderedCount + ' / ' + total + ' · Load More (' + rem + ')') : ('已显示 ' + renderedCount + ' / ' + total + ' 份 · 继续加载 (' + rem + ' 份)')) +
          '</button>';
        } else if (total > PAGE_SIZE) {
          foot.innerHTML = '<span style="font-size:0.78rem;color:var(--mui-text-muted);">' +
            (isEn() ? ('All ' + total + ' documents loaded') : ('已全部加载，共 ' + total + ' 份')) +
          '</span>';
        } else {
          foot.innerHTML = '';
        }
      }

      function appendMoreCards() {
        if (state.view !== 'cards') return;
        var grid = document.getElementById('cardsGridEl');
        if (!grid || renderedCount >= currentResults.length) return;
        var tokens = getTokens();
        var nextEnd = Math.min(currentResults.length, renderedCount + PAGE_SIZE);
        var slice = currentResults.slice(renderedCount, nextEnd);
        var tmp = document.createElement('div');
        tmp.innerHTML = slice.map(function (it) { return renderCardHtml(it, tokens); }).join('');
        var frag = document.createDocumentFragment();
        while (tmp.firstChild) frag.appendChild(tmp.firstChild);
        grid.appendChild(frag);
        renderedCount = nextEnd;
        state.visibleCount = renderedCount;
        updateSentinelFooter();
      }

      function setupIntersectionSentinel() {
        if (ioObserver) {
          ioObserver.disconnect();
          ioObserver = null;
        }
        var target = document.getElementById('cardsSentinel');
        if (!target || !('IntersectionObserver' in window)) return;
        ioObserver = new IntersectionObserver(function (entries) {
          if (entries[0] && entries[0].isIntersecting && renderedCount < currentResults.length) {
            appendMoreCards();
          }
        }, { rootMargin: '280px 0px' });
        ioObserver.observe(target);
      }

      function renderTableView(list, tokens) {
        var wrap = document.getElementById('viewTable');
        if (!wrap) return;
        if (!list.length) {
          wrap.innerHTML = '<div style="padding:44px;text-align:center;background:var(--mui-bg-paper);border:1px solid var(--mui-border);border-radius:14px;color:var(--mui-text-secondary);">' + (isEn() ? 'No matching records' : '暂无匹配记录') + '</div>';
          return;
        }
        var rowsHtml = list.map(function (it) {
          var href = resolveItemHref(it);
          var cLbl = catLabel(it.category);
          var snippets = extractContextSnippets(it, tokens, 1);
          return '<tr>' +
            '<td><span class="MuiTickerBadge mono">' + highlight(it.ticker || it.company, tokens) + '</span><div style="font-size:0.75rem;color:var(--mui-text-secondary);margin-top:3px;">' + highlight(it.company, tokens) + '</div></td>' +
            '<td style="min-width:220px;max-width:460px;">' +
              '<div style="font-weight:700;cursor:pointer;color:var(--mui-text-primary);overflow-wrap:anywhere;" data-open-reader="' + esc(it.id) + '">' + highlight(it.title, tokens) + '</div>' +
              '<div class="mono" style="font-size:0.73rem;color:var(--mui-text-muted);margin-top:2px;overflow-wrap:anywhere;">' + highlight(it.relPath, tokens) + '</div>' +
              (snippets.length ? ('<div style="font-size:0.75rem;color:var(--mui-primary);margin-top:4px;overflow-wrap:anywhere;">' + highlight(snippets[0], tokens) + '</div>') : '') +
            '</td>' +
            '<td style="white-space:nowrap;"><span class="MuiCatTag">' + esc(cLbl) + '</span></td>' +
            '<td class="mono" style="font-size:0.76rem;color:var(--mui-text-secondary);white-space:nowrap;">' + esc(fmtWords(it.wordCount) || fmtBytes(it.size)) + '</td>' +
            '<td class="mono" style="font-size:0.76rem;color:var(--mui-text-muted);white-space:nowrap;">' + esc(String(it.modifiedTime || '').slice(0, 10)) + '</td>' +
            '<td style="white-space:nowrap;">' +
              '<div style="display:flex;gap:6px;">' +
                '<button type="button" class="MuiBtn" style="height:28px;padding:0 9px;font-size:0.75rem;" data-open-reader="' + esc(it.id) + '">' + (isEn() ? 'Preview' : '速览') + '</button>' +
                '<a class="MuiBtn MuiBtn-primary" style="height:28px;padding:0 10px;font-size:0.75rem;" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + (isEn() ? 'Open ↗' : '打开 ↗') + '</a>' +
              '</div>' +
            '</td>' +
          '</tr>';
        }).join('');

        wrap.innerHTML = '<div class="MuiDataGrid-wrap">' +
          '<table class="MuiDataGrid">' +
            '<thead><tr>' +
              (isEn()
                ? '<th>Ticker / Folder</th><th>Title &amp; Path</th><th>Category</th><th>Length</th><th>Date</th><th>Actions</th>'
                : '<th>代码 / 目录</th><th>标题与路径</th><th>分类</th><th>字数</th><th>日期</th><th>操作</th>') +
            '</tr></thead>' +
            '<tbody>' + rowsHtml + '</tbody>' +
          '</table>' +
        '</div>';
      }

      function renderGroupedView(list, tokens) {
        var wrap = document.getElementById('viewGrouped');
        if (!wrap) return;
        var grouped = {};
        list.forEach(function (it) {
          if (!grouped[it.company]) grouped[it.company] = [];
          grouped[it.company].push(it);
        });

        var comps = (CATALOG.companies || []).filter(function (c) {
          return grouped[c.folder] && grouped[c.folder].length > 0;
        });
        if (grouped['根目录'] && grouped['根目录'].length) {
          comps.push({ folder: '根目录', label: '根目录文档', ticker: 'ROOT', sector: '' });
        }

        if (!comps.length) {
          wrap.innerHTML = '<div style="padding:44px;text-align:center;background:var(--mui-bg-paper);border:1px solid var(--mui-border);border-radius:14px;color:var(--mui-text-secondary);">' + (isEn() ? 'No matching company groups' : '没有匹配的公司分组') + '</div>';
          return;
        }

        wrap.innerHTML = '<div style="display:flex;flex-direction:column;gap:24px;">' + comps.map(function (c) {
          var arr = grouped[c.folder] || [];
          return '<section>' +
            '<div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--mui-border);flex-wrap:wrap;gap:8px;">' +
              '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
                '<span style="font-size:1.02rem;font-weight:800;">' + highlight(compLabel(c.folder, c.label), tokens) + '</span>' +
                '<span class="MuiTickerBadge mono">' + highlight(c.ticker || c.folder, tokens) + '</span>' +
                '<span style="font-size:0.78rem;color:var(--mui-text-secondary);">' + arr.length + (isEn() ? (arr.length === 1 ? ' doc' : ' docs') : ' 份') + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="MuiCardGrid">' + arr.map(function (it) { return renderCardHtml(it, tokens); }).join('') + '</div>' +
          '</section>';
        }).join('') + '</div>';
      }

      function renderTreeExplorer(tokens) {
        var treePane = document.getElementById('treeLeftContainer');
        var detailPane = document.getElementById('treeRightInspector');
        if (!treePane || !detailPane) return;
        var rootId = (CATALOG.root && CATALOG.root.id) || 'root_docs';
        var shownFolders = 0;

        function isNodeVisible(fid) {
          var n = folderNodes[fid];
          if (!n) return false;
          var cnt = countFolderItems(fid);
          if (fid !== rootId && state.treeHideEmpty && cnt === 0) return false;
          if (!tokens.length) return true;
          var selfHay = (n.name + ' ' + (n.label || '') + ' ' + n.relPath).toLowerCase();
          if (tokens.every(function (t) { return selfHay.indexOf(t) !== -1; })) return true;
          for (var i = 0; i < n.files.length; i++) {
            var it = itemById[n.files[i]];
            if (it && tokens.every(function (t) { return it._allHay.indexOf(t) !== -1; })) return true;
          }
          return n.children.some(isNodeVisible);
        }

        function drawNode(fid) {
          if (!isNodeVisible(fid)) return '';
          var n = folderNodes[fid];
          shownFolders += 1;
          var expKey = fid === rootId ? 'ROOT' : n.relPath;
          var isOpen = tokens.length ? true : !!state.treeExpanded[expKey];
          var cnt = countFolderItems(fid);
          var childrenHtml = '';
          if (n.children.length && isOpen) {
            var inner = n.children.map(drawNode).join('');
            if (inner) childrenHtml = '<div class="MuiTreeIndent">' + inner + '</div>';
          }
          var arrow = n.children.length ? (isOpen ? '▾ ' : '▸ ') : '· ';
          return '<div>' +
            '<div class="MuiTreeRow' + (state.selectedFolderId === fid ? ' selected' : '') + '" data-tree-node="' + esc(fid) + '" data-tree-key="' + esc(expKey) + '">' +
              '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + arrow + highlight(fid === rootId ? (isEn() ? 'docs (Root)' : 'docs (根目录)') : n.name, tokens) + '</span>' +
              '<span class="mono" style="font-size:0.73rem;opacity:0.75;">' + cnt + '</span>' +
            '</div>' +
            childrenHtml +
          '</div>';
        }

        treePane.innerHTML = drawNode(rootId);
        var totalSubs = (CATALOG.stats && CATALOG.stats.totalSubfolders) || Math.max(0, Object.keys(folderNodes).length - 1);
        var countLbl = document.getElementById('treeCountLabel');
        if (countLbl) countLbl.textContent = isEn() ? ('Showing ' + Math.max(0, shownFolders - 1) + ' / ' + totalSubs + ' subfolders') : ('显示 ' + Math.max(0, shownFolders - 1) + ' / ' + totalSubs + ' 个子目录');

        var curNode = folderNodes[state.selectedFolderId] || folderNodes[rootId];
        var subDirs = curNode.children.map(function (cid) { return folderNodes[cid]; }).filter(function (sn) {
          return sn && (!state.treeHideEmpty || countFolderItems(sn.id) > 0);
        });

        var descendantFiles = [];
        function collectFiles(nid) {
          var nd = folderNodes[nid];
          if (!nd) return;
          nd.files.forEach(function (itemId) {
            if (itemById[itemId]) descendantFiles.push(itemById[itemId]);
          });
          nd.children.forEach(collectFiles);
        }
        collectFiles(curNode.id);

        detailPane.innerHTML =
          '<div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--mui-border);flex-wrap:wrap;gap:8px;">' +
            '<div style="min-width:0;">' +
              '<div class="mono" style="font-size:0.92rem;font-weight:700;color:var(--mui-primary);overflow-wrap:anywhere;">📁 ' + esc(curNode.relPath ? ('docs/' + curNode.relPath + '/') : 'docs/') + '</div>' +
              '<div style="font-size:0.77rem;color:var(--mui-text-secondary);margin-top:2px;">' +
                (isEn() ? (descendantFiles.length + ' docs · ' + subDirs.length + ' subfolders') : ('共 ' + descendantFiles.length + ' 份文档 · ' + subDirs.length + ' 个子目录')) +
              '</div>' +
            '</div>' +
            (curNode.parentId ? ('<button type="button" class="MuiBtn" data-sel-folder="' + esc(curNode.parentId) + '">' + (isEn() ? '↑ Up' : '↑ 上级') + '</button>') : '') +
          '</div>' +
          (subDirs.length ? (
            '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;">' +
              subDirs.map(function (sd) {
                return '<button type="button" class="MuiBtn" data-sel-folder="' + esc(sd.id) + '">📁 ' + esc(sd.name) + ' (' + countFolderItems(sd.id) + ')</button>';
              }).join('') +
            '</div>'
          ) : '') +
          (descendantFiles.length
            ? ('<div class="MuiCardGrid" style="margin-top:14px;">' + descendantFiles.map(function (it) { return renderCardHtml(it, tokens); }).join('') + '</div>')
            : '<div style="padding:32px 12px;text-align:center;color:var(--mui-text-muted);">该目录当前为空预留目录</div>');
      }

      function renderLeftSidebar() {
        var ul = document.getElementById('sidebarTreeList');
        if (!ul) return;

        function buildSub(fid) {
          var nd = folderNodes[fid];
          if (!nd) return '';
          var html = '';
          nd.children.forEach(function (cid) {
            var ch = folderNodes[cid];
            if (!ch) return;
            var cnt = countFolderItems(cid);
            if (cnt === 0 && countFolderItems(fid) > 0) return;
            var open = !!state.navOpen[ch.relPath];
            var lbl = (ch.level === 2 && CAT_LABELS_ZH[ch.name]) ? (isEn() ? (ch.name + ' · ' + catLabel(ch.name)) : (ch.name + ' · ' + CAT_LABELS_ZH[ch.name])) : ch.name;
            html += '<li>' +
              '<button type="button" class="MuiNavTree-btn" data-side-folder="' + esc(cid) + '" data-side-key="' + esc(ch.relPath) + '">' +
                '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (open ? '▾ ' : '▸ ') + esc(lbl) + '</span>' +
                '<span class="mono" style="font-size:0.7rem;opacity:0.7;">' + cnt + '</span>' +
              '</button>' +
              (open ? buildSub(cid) : '') +
            '</li>';
          });
          nd.files.forEach(function (itemId) {
            var it = itemById[itemId];
            if (!it) return;
            html += '<li>' +
              '<button type="button" class="MuiNavTree-leaf" data-open-reader="' + esc(it.id) + '" title="' + esc(it.title) + '">' +
                '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">📄 ' + esc(it.name.replace(/\.html?$/i, '')) + '</span>' +
              '</button>' +
            '</li>';
          });
          return html ? ('<ul class="MuiNavTree-sub">' + html + '</ul>') : '';
        }

        var fq = (state.drawerFolderQuery || '').trim().toLowerCase();
        var out = '';
        if (!fq) {
          out += '<li><button type="button" class="MuiNavTree-btn' + (state.company === 'ALL' ? ' active' : '') + '" data-side-all="1"><span>' + (isEn() ? 'All Documents' : '全部文档') + '</span><span class="mono">' + contentItems.length + '</span></button></li>';
        }
        var matchedComps = 0;
        (CATALOG.companies || []).forEach(function (c) {
          if (fq) {
            var cHay = (c.folder + ' ' + (c.label || '') + ' ' + (COMPANY_LABELS_EN[c.folder] || '') + ' ' + (c.ticker || '') + ' ' + (c.sector || '')).toLowerCase();
            if (cHay.indexOf(fq) === -1) return;
          }
          matchedComps += 1;
          var isOpen = fq ? true : !!state.navOpen[c.folder];
          var act = state.company === c.folder ? ' active' : '';
          out += '<li>' +
            '<button type="button" class="MuiNavTree-btn' + act + '" data-side-company="' + esc(c.folder) + '">' +
              '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (isOpen ? '▾ ' : '▸ ') + esc(isEn() ? (c.folder + ' · ' + compLabel(c.folder, c.label)) : (c.folder + ' · ' + (c.label || ''))) + '</span>' +
              '<span class="mono" style="font-size:0.72rem;opacity:0.75;">' + (c.reportCount || 0) + '</span>' +
            '</button>' +
            (isOpen ? buildSub(c.id) : '') +
          '</li>';
        });
        if (fq && matchedComps === 0) {
          out += '<li style="padding:10px;font-size:0.78rem;color:var(--mui-text-muted);text-align:center;">' + (isEn() ? 'No matching folders' : '未匹配到目录') + '</li>';
        }
        ul.innerHTML = out;
      }

      function openReaderDrawer(itemId) {
        var it = itemById[itemId];
        if (!it) return;
        state.activeReaderId = itemId;
        var tokens = getTokens();
        var href = resolveItemHref(it);
        var cLbl = catLabel(it.category);
        var compDisp = compLabel(it.company, it.companyLabel);

        document.getElementById('readerMeta').textContent =
          compDisp + ' · ' + cLbl + ' · ' + it.relPath + (it.wordCount ? (' · ' + fmtWords(it.wordCount)) : '');
        document.getElementById('readerTitle').textContent = it.title;

        var snippets = extractContextSnippets(it, tokens, 6);
        var matchedBlock = '';
        if (snippets.length) {
          matchedBlock = '<div>' +
            '<div style="font-weight:700;font-size:0.84rem;color:var(--mui-primary);margin-bottom:8px;">' + (isEn() ? 'Matched Excerpts:' : '检索命中片段：') + '</div>' +
            '<div style="display:flex;flex-direction:column;gap:8px;">' +
              snippets.map(function (s) { return '<div class="MuiHitSnippet">' + highlight(s, tokens) + '</div>'; }).join('') +
            '</div>' +
          '</div>';
        }

        var headingsHtml = (it.headings && it.headings.length)
          ? ('<div style="border:1px solid var(--mui-border);border-radius:10px;overflow:hidden;">' +
              it.headings.map(function (h, idx) {
                return '<div style="padding:8px 12px;font-size:0.82rem;overflow-wrap:anywhere;' + (idx > 0 ? 'border-top:1px solid var(--mui-border);' : '') + '">' + highlight(h, tokens) + '</div>';
              }).join('') +
            '</div>')
          : '<div style="color:var(--mui-text-muted);font-size:0.82rem;">' + (isEn() ? 'No section headings' : '暂无章节标题') + '</div>';

        var liveIframeBlock = '';
        if (isDirectRelEnv() && (it.fileType === 'HTML' || !it.fileType)) {
          liveIframeBlock = '<div>' +
            '<div style="font-weight:700;font-size:0.84rem;margin-bottom:8px;">' + (isEn() ? 'Live Preview:' : '页面预览：') + '</div>' +
            '<iframe class="MuiPreviewFrame" src="' + esc(href) + '" title="' + esc(it.name) + '"></iframe>' +
          '</div>';
        } else if (it._bodyText) {
          liveIframeBlock = '<div>' +
            '<div style="font-weight:700;font-size:0.84rem;margin-bottom:8px;">' + (isEn() ? 'Full-Text Preview:' : '正文速览：') + '</div>' +
            '<div style="padding:14px;border-radius:10px;border:1px solid var(--mui-border);background:var(--mui-bg-subtle);font-size:0.83rem;line-height:1.72;color:var(--mui-text-secondary);max-height:300px;overflow-y:auto;overflow-wrap:anywhere;">' +
              highlight(it._bodyText.slice(0, 3000) + (it._bodyText.length > 3000 ? '…' : ''), tokens) +
            '</div>' +
          '</div>';
        }

        document.getElementById('readerBody').innerHTML =
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            '<a class="MuiBtn MuiBtn-primary" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + (isEn() ? 'Open in New Tab ↗' : '新窗口打开文件 ↗') + '</a>' +
            '<button type="button" class="MuiBtn" data-copy-path="' + esc(it.relPath) + '">' + (isEn() ? 'Copy Path' : '复制路径') + '</button>' +
          '</div>' +
          matchedBlock +
          '<div>' +
            '<div style="font-weight:700;font-size:0.84rem;margin-bottom:6px;">' + (isEn() ? 'Summary:' : '核心摘要：') + '</div>' +
            '<div style="padding:12px 14px;border-radius:10px;background:var(--mui-bg-subtle);border:1px solid var(--mui-border);font-size:0.83rem;color:var(--mui-text-secondary);line-height:1.65;overflow-wrap:anywhere;">' +
              highlight(it.summary || '', tokens) +
            '</div>' +
          '</div>' +
          liveIframeBlock +
          '<div>' +
            '<div style="font-weight:700;font-size:0.84rem;margin-bottom:8px;">' + (isEn() ? 'Section Outline (' : '章节大纲 (') + (it.headings ? it.headings.length : 0) + (isEn() ? '):' : ')：') + '</div>' +
            headingsHtml +
          '</div>';

        document.getElementById('readerBackdrop').classList.add('open');
      }

      function updateDrawerStatsText() {
        var dLbl = document.getElementById('drawerStatsLabel');
        if (!dLbl) return;
        var fc = (CATALOG.companies || []).length;
        var dc = contentItems.length;
        dLbl.textContent = isEn() ? (fc + ' Folders · ' + dc + ' Docs') : (fc + ' 个目录 · ' + dc + ' 份文档');

        var gInp = document.getElementById('globalSearchInput');

        var homeBtn = document.getElementById('brandHomeBtn');

        /* Sort select options */
        var sortSel = document.getElementById('sortSelect');

          sortSel.setAttribute('aria-label', en ? 'Sort order' : '排序方式');
          var sortMap = en
            ? { relevance: 'Relevance', time_desc: 'Latest Updated', company_asc: 'By Company', title_asc: 'By Title' }
            : { relevance: '智能排序', time_desc: '最新更新', company_asc: '按公司名', title_asc: '按标题名' };
          for (var si = 0; si < sortSel.options.length; si++) {

            if (sortMap[ov]) sortSel.options[si].textContent = sortMap[ov];

        }
        var compSel = document.getElementById('companyFilterSelect');
        if (compSel) compSel.setAttribute('aria-label', en ? 'Filter by folder' : '按公司目录筛选');

        /* View toggle buttons */
        var viewMap = en
          ? { cards: ['Cards', 'Card view'], table: ['Table', 'Table view'], grouped: ['Grouped', 'Group by company'], tree: ['Tree', 'Directory tree'] }
          : { cards: ['列表', '卡片视图'], table: ['表格', '数据表视图'], grouped: ['按公司', '按公司分组'], tree: ['目录树', '目录树视图'] };
        document.querySelectorAll('[data-view]').forEach(function (vb) {
          var vk = vb.getAttribute('data-view');
          var pair = viewMap[vk];
          if (pair) {
            var sp = vb.querySelector('.MuiToggleLabel');
            if (sp) sp.textContent = pair[0];
            vb.setAttribute('title', pair[1]);
            vb.setAttribute('aria-label', pair[1]);
          }
        });

        /* Tree top buttons & Reader chrome */

        if (thBtn) {
          thBtn.textContent = state.treeHideEmpty

            : (en ? 'Show All Folders' : '显示全部目录');

        var expBtn = document.getElementById('expandAllTreeBtn');

        var clsRdr = document.getElementById('closeReaderBtn');
        if (clsRdr) clsRdr.textContent = en ? 'Close' : '关闭';

        if (rdrTitle && !state.activeReaderId) rdrTitle.textContent = en ? 'Document Inspector' : '文档详情';

          openReaderDrawer(state.activeReaderId);

        saveStore(LANG_STORAGE_KEY, state.lang);

          showToast(en ? 'Switched to English Research Hub' : '已切换至中文数据中心视图');

            : '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>';
        }
      }

      function setLeftDrawerOpen(nextOpen) {
        state.drawerOpen = !!nextOpen;
        var drw = document.getElementById('leftDrawer');
        var bkd = document.getElementById('leftDrawerBackdrop');
        var btn = document.getElementById('drawerToggleBtn');
        if (drw) drw.classList.toggle('open', state.drawerOpen);
        if (bkd) bkd.classList.toggle('open', state.drawerOpen);
        if (btn) {
          btn.classList.toggle('active', state.drawerOpen);
          btn.setAttribute('aria-expanded', state.drawerOpen ? 'true' : 'false');
        }
        if (state.drawerOpen) {
          renderDrawerNavSections();
          renderLeftSidebar();
        }
      }

      function closeAllDrawers() {
        document.getElementById('readerBackdrop').classList.remove('open');
        state.activeReaderId = null;
        setLeftDrawerOpen(false);
      }

      function toggleDrawerPanel() {
        setLeftDrawerOpen(!state.drawerOpen);
      }

      function renderAll() {
        var tokens = getTokens();
        currentResults = filterAndRankItems();

        var clearBtn = document.getElementById('clearSearchBtn');
        if (clearBtn) clearBtn.classList.toggle('hidden', !state.query.trim());

        document.querySelectorAll('[data-view]').forEach(function (b) {
          var isAct = b.getAttribute('data-view') === state.view;
          b.classList.toggle('active', isAct);
          b.setAttribute('aria-selected', isAct ? 'true' : 'false');
        });

        document.getElementById('viewCards').classList.toggle('hidden', state.view !== 'cards');
        document.getElementById('viewTable').classList.toggle('hidden', state.view !== 'table');
        document.getElementById('viewGrouped').classList.toggle('hidden', state.view !== 'grouped');
        document.getElementById('viewTree').classList.toggle('hidden', state.view !== 'tree');

        renderCategoryChips();
        renderMatchedFoldersBar(tokens);

        if (state.drawerOpen) {
          renderLeftSidebar();
        }

        if (state.view === 'cards') renderCardsView(currentResults, tokens);
        else if (state.view === 'table') renderTableView(currentResults, tokens);
        else if (state.view === 'grouped') renderGroupedView(currentResults, tokens);
        else renderTreeExplorer(tokens);
      }

      function init() {
        applyTheme();
        rebuildDataStructures();
        applyPortalLanguage(state.lang, true);

        document.getElementById('portalLangZhBtn').addEventListener('click', function () { applyPortalLanguage('zh', false); });
        document.getElementById('portalLangEnBtn').addEventListener('click', function () { applyPortalLanguage('en', false); });

        window.addEventListener('storage', function (ev) {
          if (ev.key === THEME_STORAGE_KEY && ev.newValue) {
            var nt = String(ev.newValue).replace(/^"|"$/g, '');
            if ((nt === 'light' || nt === 'dark') && nt !== state.theme) {
              state.theme = nt;
              applyTheme();
            }
          } else if (ev.key === LANG_STORAGE_KEY && ev.newValue) {
            var nl = String(ev.newValue).replace(/^"|"$/g, '');
            if ((nl === 'zh' || nl === 'en') && nl !== state.lang) {
              applyPortalLanguage(nl, true);
            }
          }
        });

        var searchInput = document.getElementById('globalSearchInput');
        var rafId = 0;
        searchInput.addEventListener('input', function (e) {
          state.query = e.target.value || '';
          state.visibleCount = PAGE_SIZE;
          if (rafId) window.cancelAnimationFrame(rafId);
          rafId = window.requestAnimationFrame(renderAll);
        });

        document.getElementById('clearSearchBtn').addEventListener('click', function () {
          state.query = '';
          searchInput.value = '';
          state.visibleCount = PAGE_SIZE;
          searchInput.focus();
          renderAll();
        });

        document.getElementById('drawerToggleBtn').addEventListener('click', toggleDrawerPanel);

        document.getElementById('brandHomeBtn').addEventListener('click', function () {
          state.query = '';
          state.company = 'ALL';
          state.category = 'ALL';
          state.drawerFolderQuery = '';
          searchInput.value = '';
          var fIn = document.getElementById('drawerFolderFilterInput');
          if (fIn) fIn.value = '';
          populateCompanySelect();
          setLeftDrawerOpen(false);
          renderAll();
        });

        document.getElementById('toggleFoldersAccBtn').addEventListener('click', function () {
          state.foldersSectionOpen = !state.foldersSectionOpen;
          document.getElementById('drawerFoldersBody').classList.toggle('hidden', !state.foldersSectionOpen);
          document.getElementById('drawerFoldersChevron').textContent = state.foldersSectionOpen ? '▾' : '▸';
          document.getElementById('toggleFoldersAccBtn').setAttribute('aria-expanded', state.foldersSectionOpen ? 'true' : 'false');
        });

        document.getElementById('drawerFolderFilterInput').addEventListener('input', function (e) {
          state.drawerFolderQuery = e.target.value || '';
          renderLeftSidebar();
        });

        document.getElementById('closeLeftDrawerBtn').addEventListener('click', function () {
          setLeftDrawerOpen(false);
        });

        document.getElementById('leftDrawerBackdrop').addEventListener('click', closeAllDrawers);

        document.getElementById('themeToggleBtn').addEventListener('click', function () {
          state.theme = state.theme === 'dark' ? 'light' : 'dark';
          saveStore(THEME_STORAGE_KEY, state.theme);
          applyTheme();
        });

        document.getElementById('companyFilterSelect').addEventListener('change', function (e) {
          state.company = e.target.value;
          state.visibleCount = PAGE_SIZE;
          renderAll();
        });

        document.getElementById('sortSelect').addEventListener('change', function (e) {
          state.sort = e.target.value;
          state.visibleCount = PAGE_SIZE;
          renderAll();
        });

        document.getElementById('treeHideEmptyBtn').addEventListener('click', function (e) {
          state.treeHideEmpty = !state.treeHideEmpty;
          e.currentTarget.className = state.treeHideEmpty ? 'MuiBtn MuiBtn-primary' : 'MuiBtn';
          e.currentTarget.textContent = state.treeHideEmpty ? (isEn() ? 'Non-Empty Only' : '仅显示含文件目录') : (isEn() ? 'Show All Folders' : '显示全部目录');
          renderAll();
        });

        document.getElementById('expandAllTreeBtn').addEventListener('click', function () {
          Object.keys(folderNodes).forEach(function (fid) {
            var n = folderNodes[fid];
            if (n) state.treeExpanded[n.relPath || 'ROOT'] = true;
          });
          renderAll();
        });

        document.getElementById('closeReaderBtn').addEventListener('click', closeAllDrawers);
        document.getElementById('readerBackdrop').addEventListener('click', function (e) {
          if (e.target === e.currentTarget) closeAllDrawers();
        });

        document.addEventListener('keydown', function (e) {
          var tag = document.activeElement ? document.activeElement.tagName : '';
          if (((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') || (e.key === '/' && tag !== 'INPUT' && tag !== 'SELECT')) {
            e.preventDefault();
            searchInput.focus();
            searchInput.select();
          } else if (e.key === 'Escape') {
            closeAllDrawers();
          }
        });

        window.addEventListener('scroll', function () {
          if (state.view === 'cards' && renderedCount < currentResults.length) {
            var rem = document.documentElement.scrollHeight - (window.scrollY + window.innerHeight);
            if (rem < 300) appendMoreCards();
          }
        }, { passive: true });

        document.body.addEventListener('click', function (e) {
          var drwGrpBtn = e.target.closest('[data-drawer-group]');
          if (drwGrpBtn) {
            var gKey = drwGrpBtn.getAttribute('data-drawer-group');
            state.drawerGroupClosed[gKey] = !state.drawerGroupClosed[gKey];
            renderDrawerNavSections();
            return;
          }

          var viewBtn = e.target.closest('[data-view]');
          if (viewBtn) {
            state.view = viewBtn.getAttribute('data-view');
            renderAll();
            return;
          }

          var catBtn = e.target.closest('[data-cat]');
          if (catBtn) {
            state.category = catBtn.getAttribute('data-cat');
            state.visibleCount = PAGE_SIZE;
            renderAll();
            return;
          }

          var favBtn = e.target.closest('[data-fav-id]');
          if (favBtn) {
            var fid = favBtn.getAttribute('data-fav-id');
            if (state.favorites[fid]) delete state.favorites[fid];
            else state.favorites[fid] = true;
            saveStore(FAV_STORAGE_KEY, state.favorites);
            renderAll();
            return;
          }

          var cpPathBtn = e.target.closest('[data-copy-path]');
          if (cpPathBtn) {
            copyText(cpPathBtn.getAttribute('data-copy-path'), (isEn() ? 'Copied path: ' : '已复制路径：') + cpPathBtn.getAttribute('data-copy-path'));
            return;
          }

          var outBtn = e.target.closest('[data-toggle-outline]');
          if (outBtn) {
            var oid = outBtn.getAttribute('data-toggle-outline');
            if (state.expandedCards[oid]) delete state.expandedCards[oid];
            else state.expandedCards[oid] = true;
            renderAll();
            return;
          }

          var readerTrigger = e.target.closest('[data-open-reader]');
          if (readerTrigger) {
            if (state.drawerOpen) setLeftDrawerOpen(false);
            openReaderDrawer(readerTrigger.getAttribute('data-open-reader'));
            return;
          }

          if (e.target.closest('[data-load-more]')) {
            appendMoreCards();
            return;
          }

          if (e.target.closest('[data-reset-filters]')) {
            state.query = '';
            state.company = 'ALL';
            state.category = 'ALL';
            searchInput.value = '';
            populateCompanySelect();
            renderAll();
            return;
          }

          var jmpBtn = e.target.closest('[data-jump-folder]');
          if (jmpBtn) {
            var jid = jmpBtn.getAttribute('data-jump-folder');
            if (folderNodes[jid]) {
              state.view = 'tree';
              state.treeHideEmpty = false;
              state.selectedFolderId = jid;
              var acc = '';
              folderNodes[jid].relPath.split('/').forEach(function (seg) {
                acc = acc ? (acc + '/' + seg) : seg;
                state.treeExpanded[acc] = true;
              });
              renderAll();
            }
            return;
          }

          var treeRow = e.target.closest('[data-tree-node]');
          if (treeRow) {
            var tnid = treeRow.getAttribute('data-tree-node');
            var tkey = treeRow.getAttribute('data-tree-key');
            if (state.selectedFolderId === tnid && tkey !== 'ROOT') {
              state.treeExpanded[tkey] = !state.treeExpanded[tkey];
            } else {
              state.treeExpanded[tkey] = true;
            }
            state.selectedFolderId = tnid;
            renderTreeExplorer(getTokens());
            return;
          }

          var selFBtn = e.target.closest('[data-sel-folder]');
          if (selFBtn) {
            var sfid = selFBtn.getAttribute('data-sel-folder');
            if (folderNodes[sfid]) {
              state.selectedFolderId = sfid;
              if (folderNodes[sfid].relPath) state.treeExpanded[folderNodes[sfid].relPath] = true;
              renderTreeExplorer(getTokens());
            }
            return;
          }

          if (e.target.closest('[data-side-all]')) {
            state.company = 'ALL';
            state.category = 'ALL';
            populateCompanySelect();
            setLeftDrawerOpen(false);
            renderAll();
            return;
          }

          var sideComp = e.target.closest('[data-side-company]');
          if (sideComp) {
            var sc = sideComp.getAttribute('data-side-company');
            state.navOpen[sc] = !state.navOpen[sc];
            state.company = sc;
            state.category = 'ALL';
            populateCompanySelect();
            renderAll();
            return;
          }

          var sideFold = e.target.closest('[data-side-folder]');
          if (sideFold) {
            var skey = sideFold.getAttribute('data-side-key');
            state.navOpen[skey] = !state.navOpen[skey];
            var segs = skey.split('/');
            if (segs[0]) state.company = segs[0];
            if (segs[1]) state.category = segs[1];
            populateCompanySelect();
            renderAll();
          }
        });
      }

      init();
    })();
  </script>
</body>
</html>
